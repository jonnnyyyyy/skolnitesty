<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Školní testy – výběr testu</title>
<style>
:root{--teal:#00a79d;--tealD:#008a82;--bg:#f5f5f5;--ink:#1d2125;--grey:#6a737b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.5}
a{color:var(--teal);text-decoration:none}
header{background:var(--bg);padding:20px 8vw 18px}
.crumbs{font-size:15px;color:var(--grey)}
h1{margin:10px 0 0;font-size:34px;display:flex;align-items:center;gap:14px}
h1 i{width:38px;height:38px;border:2px solid #e91e8c;border-radius:6px;display:inline-block}
main{padding:28px 8vw 60px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{display:block;border:1px solid #ddd;border-radius:10px;padding:20px 22px;color:var(--ink);transition:.15s}
.card:hover{border-color:var(--teal);box-shadow:0 2px 10px rgba(0,167,157,.15)}
.card h2{margin:0 0 6px;font-size:21px;font-weight:600;color:var(--tealD)}
.card p{margin:0;color:var(--grey);font-size:15px}
.card .go{display:inline-block;margin-top:14px;background:var(--teal);color:#fff;border-radius:8px;padding:8px 18px;font-weight:600;font-size:15px}
.note{margin-top:40px;font-size:14px;color:var(--grey)}
</style>
</head>
<body>
<header>
  <div class="crumbs">440-2104/01 (2026/2027 ZS) / Příklady k procvičení</div>
  <h1><i></i>Výběr testu</h1>
</header>
<main>
  <div class="list" id="list"><p>Načítám testy…</p></div>
  <p class="note">Nový test přidáš tak, že nahraješ jeho <code>.html</code> soubor do složky <code>testy/</code>. Tady se objeví automaticky.</p>
</main>
<script>
/* Záložní seznam – použije se, když nejde načíst obsah složky přes GitHub API
   (např. při otevření souboru lokálně). Nové testy sem přidávat nemusíš. */
const ZALOZNI=['test2.html','test-kodovani.html'];

/* Repozitář se zjistí z adresy GitHub Pages (uzivatel.github.io/repo/), jinak výchozí. */
function repo(){
  const h=location.hostname;
  if(h.endsWith('.github.io')){const r=location.pathname.split('/').filter(Boolean)[0];
    return{owner:h.split('.')[0],name:r&&!r.endsWith('.html')?r:h}}
  return{owner:'jonnnyyyyy',name:'skolnitesty'};
}
async function soubory(){
  try{const {owner,name}=repo();
    const r=await fetch(`https://api.github.com/repos/${owner}/${name}/contents/testy`);
    if(!r.ok)throw 0;
    const a=(await r.json()).filter(f=>f.type==='file'&&f.name.endsWith('.html')).map(f=>f.name);
    if(a.length)return a;
  }catch(e){}
  return ZALOZNI;
}
async function info(f){
  try{const t=await (await fetch('testy/'+f)).text();
    const d=new DOMParser().parseFromString(t,'text/html');
    return{f,title:(d.title||f).replace(/\s*–\s*procvičování\s*$/i,''),desc:d.querySelector('meta[name=description]')?.content||''}
  }catch(e){return{f,title:f.replace(/\.html$/,''),desc:''}}
}
(async()=>{
  const items=await Promise.all((await soubory()).map(info));
  items.sort((a,b)=>a.title.localeCompare(b.title,'cs',{numeric:true}));
  document.getElementById('list').innerHTML=items.map(t=>
    `<a class="card" href="testy/${encodeURIComponent(t.f)}"><h2>${t.title}</h2><p>${t.desc}</p><span class="go">Otevřít test</span></a>`).join('');
})();
</script>
</body>
</html>
