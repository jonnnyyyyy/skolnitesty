<script>
/* ---------- pomocné ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const H=(n,d=0)=>n.toString(16).toUpperCase().padStart(d,'0');
const Bn=(n,d=0)=>n.toString(2).padStart(d,'0');
const g4=s=>s.replace(/\B(?=(.{4})+$)/g,' ');          // binární řetězec po 4 bitech zprava
const C=s=>`<code>${s}</code>`;
const pts=p=>p.toFixed(2).replace('.',',');
const par=x=>x<0?`(${x})`:x;

/* ---------- vzorce Qm.f ---------- */
const SUM=(top,bot)=>`<span class="sm"><span class="lim">${top}</span><span class="sig">∑</span><span class="lim">${bot}</span></span>`;
const FORM=[
 `−<i>a<sub>m</sub></i>2<sup><i>m</i></sup> + ${SUM('<i>m</i>−1','−<i>f</i>')}<i>a<sub>i</sub></i>2<sup><i>i</i></sup>`,
 `${SUM('<i>m</i>−1','−<i>f</i>')}<i>a<sub>i</sub></i>2<sup><i>i</i></sup>`,
 `<span class="big">(</span>−<i>b</i><sub><i>n</i>−1</sub>2<sup><i>n</i>−1</sup> + ${SUM('<i>n</i>−2','0')}<i>b<sub>i</sub></i>2<sup><i>i</i></sup><span class="big">)</span> / 2<sup><i>f</i></sup>`,
 `<span class="big">(</span>${SUM('<i>n</i>−1','0')}<i>b<sub>i</sub></i>2<sup><i>i</i></sup><span class="big">)</span> / 2<sup><i>f</i></sup>`];
const FOPT=['k převodu na desítkové reálné číslo <i>Re</i>, kdy <i>a<sub>i</sub></i> jsou koeficienty binárního reálného čísla a formát Qm.f je se znaménkem.',
 'k převodu na desítkové reálné číslo <i>Re</i>, kdy <i>a<sub>i</sub></i> jsou koeficienty binárního reálného čísla a formát Qm.f je bez znaménka.',
 'k převodu na desítkové reálné číslo <i>Re</i>, kdy <i>b<sub>i</sub></i> jsou koeficienty binárního integer čísla a formát Qm.f je se znaménkem.',
 'k převodu na desítkové reálné číslo <i>Re</i>, kdy <i>b<sub>i</sub></i> jsou koeficienty binárního integer čísla a formát Qm.f je bez znaménka.'];
const FSOL=[
 `<p>Koeficienty <i>a<sub>i</sub></i> s indexy od <b>−f</b> do <b>m</b> = bity „reálného“ binárního čísla (záporné indexy = bity za radix tečkou).</p><p>Člen <b>−a<sub>m</sub>2<sup>m</sup></b> se záporným znaménkem je <b>znaménkový bit</b> (dvojkový doplněk) → formát <b>se znaménkem</b>.</p>`,
 `<p>Koeficienty <i>a<sub>i</sub></i> s indexy od <b>−f</b> do <b>m−1</b> = bity „reálného“ binárního čísla (záporné indexy jsou za radix tečkou).</p><p>Není tam žádný záporný člen → všechny váhy jsou kladné → formát <b>bez znaménka</b>.</p>`,
 `<p>Indexy začínají od <b>0</b> → <i>b<sub>i</sub></i> jsou bity celého čísla (<b>integer</b>), výsledek se pak vydělí měřítkem 2<sup>f</sup>.</p><p>Nejvyšší bit má zápornou váhu <b>−b<sub>n−1</sub>2<sup>n−1</sup></b> (dvojkový doplněk) → <b>se znaménkem</b>.</p>`,
 `<p>Indexy začínají od <b>0</b> → <i>b<sub>i</sub></i> jsou bity celého čísla (<b>integer</b>), výsledek se pak vydělí měřítkem 2<sup>f</sup>.</p><p>Všechny váhy jsou kladné (není tam záporný člen) → <b>bez znaménka</b>.</p>`];
const FHINT=`<p><b>Jak to poznat:</b> <i>a<sub>i</sub></i> + meze od −f = reálné číslo; <i>b<sub>i</sub></i> + meze od 0 + dělení 2<sup>f</sup> = integer. Záporný člen u nejvyššího bitu = se znaménkem.</p>`;

/* ---------- Qm.f – pravda / nepravda ---------- */
const QF_T=['<i>f</i> značí počet bitů zlomkové části','<i>m</i> + <i>f</i> + 1 značí počet bitů pro zobrazení čísla v pevné řádové čárce','<i>m</i> značí počet bitů celé části (před radix tečkou)'];
const QF_F=['<i>m</i> značí počet bitů za radix tečkou','<i>f</i> značí počet bitů celé části (před radix tečkou)','<i>m</i> značí počet bitů zlomkové části','<i>m</i> + <i>f</i> značí počet bitů pro zobrazení čísla v pevné řádové čárce se znaménkem','<i>f</i> značí počet bitů před radix tečkou'];
const QF_SOL=`<p>Formát <b>Qm.f</b> (se znaménkem): <b>1</b> znaménkový bit + <b>m</b> bitů celé části + <b>f</b> bitů zlomkové části (za radix tečkou).</p>
<p>Celkem tedy <b>m + f + 1</b> bitů. Měřítko je <b>2<sup>−f</sup> = 1/2<sup>f</sup></b>.</p><p>Příklad: Q3.4 = <code>s mmm.ffff</code> = 8 bitů.</p>`;

/* ---------- De Morgan ---------- */
const DM=[['negace součinu rovná součtu negací',1],['negace součtu rovná součinu negací',1],['součin negací rovná negaci součtu',1],['součet negací rovná negaci součinu',1],
 ['součin negací rovná negaci součinu',0],['součet negací rovná negaci součtu',0],['negace součinu rovná součinu negací',0],['negace součtu rovná součtu negací',0]];
const DM_SOL=`<p>De Morganovy zákony: <span class="fm2">¬(A·B) = ¬A + ¬B</span> &nbsp;a&nbsp; <span class="fm2">¬(A+B) = ¬A · ¬B</span></p>
<p>Tedy: <b>negace součinu = součet negací</b> a <b>negace součtu = součin negací</b>. Při negaci se operace vždy <b>prohodí</b> (· ↔ +).</p>
<p>Chyták: když je v obou stranách věty stejná operace (součin–součin nebo součet–součet), je to <b>špatně</b>.</p>`;
function dmSol(txt,ok){const m=/(negace (součinu|součtu)|(součin|součet) negací) rovná (negaci (součinu|součtu)|(součinu|součtu) negací)/.exec(txt);
 const f=s=>({'negace součinu':'¬(A·B)','negace součtu':'¬(A+B)','součin negací':'¬A·¬B','součet negací':'¬A+¬B','negaci součinu':'¬(A·B)','negaci součtu':'¬(A+B)','součinu negací':'¬A·¬B','součtu negací':'¬A+¬B'}[s]);
 return `<p>Věta zapsaná vzorcem: <span class="fm2">${f(m[1])} = ${f(m[4])}</span> → <b>${ok?'platí (Ano)':'neplatí (Ne)'}</b>.</p>${DM_SOL}`}

/* ---------- postupy ---------- */
const s8=v=>v>127?v-256:v;
function solByte(b,m,f){const s=Bn(b,8),v=s8(b),r=v/2**f;
 return `<ol><li>0x${H(b,2)} = ${C(g4(s))}</li>
 <li>${b>127?`Nejvyšší bit je <b>1</b> → číslo je <b>záporné</b> (dvojkový doplněk): jako integer ${b} − 256 = <b>${v}</b>`:`Nejvyšší bit je <b>0</b> → číslo je kladné, jako integer <b>${v}</b>`}</li>
 <li>Formát Q${m}.${f} → za radix tečkou ${f===1?'je <b>1</b> bit':f<5?`jsou <b>${f}</b> bity`:`je <b>${f}</b> bitů`} → měřítko 2<sup>−${f}</sup> = 1/${2**f}</li>
 <li>Re = ${v} / ${2**f} = <b>${String(r).replace('.',',')}</b></li></ol>
 <p style="color:#6a737b">Jinak: radix tečka je před posledními ${f===1?'1 bitem':f+' bity'}: ${C(s.slice(0,8-f)+'.'+s.slice(8-f))}${b>127?` – u záporného čísla je ale jednodušší přes integer jako výše`:` = ${String(r).replace('.',',')}`}.</p>`}
function solAdd(a,b){const s=(a+b)&15,c=a+b>15?1:0,sa=a>7?a-16:a,sb=b>7?b-16:b,ss=s>7?s-16:s,N=s>>3&1,Z=s===0?1:0,V=(a>>3)===(b>>3)&&(s>>3)!==(a>>3)?1:0;
 return `<ol><li>Binární součet: ${C(Bn(a,4))} + ${C(Bn(b,4))} = ${a} + ${b} = ${a+b}${c?` = ${C(Bn(a+b,5))} → do 4 bitů se vejde ${C(Bn(s,4))}, přenos ven = 1`:` = <b>${C(Bn(s,4))}</b>`}</li>
 <li>Bez znaménka: ${C(Bn(s,4))} = <b>${s}</b></li>
 <li>Dvojkový doplněk: ${s>7?`nejvyšší bit je 1 → záporné: ${s} − 16 = <b>${ss}</b>`:`nejvyšší bit je 0 → kladné: <b>${ss}</b>`}</li>
 <li><b>N</b> (negative) = nejvyšší bit výsledku = <b>${N}</b></li>
 <li><b>Z</b> (zero) = 1, jen když je výsledek 0000 → <b>${Z}</b></li>
 <li><b>V</b> (overflow) – přetečení se znaménkem: ${par(sa)} + ${par(sb)} = ${sa+sb}${sa+sb>7||sa+sb<-8?` je mimo rozsah −8…7 → <b>V = 1</b>`:` se vejde do −8…7 → <b>V = 0</b>`} <span style="color:#6a737b">(pravidlo: dvě čísla se stejným znaménkem dají výsledek s opačným znaménkem)</span></li>
 <li><b>C</b> (carry) – přenos z nejvyššího bitu (přetečení bez znaménka): ${a} + ${b} = ${a+b} ${c?'&gt; 15 → <b>C = 1</b>':'≤ 15 → <b>C = 0</b>'}</li></ol>`}
function solNeg(n,b){return `<ol><li>Absolutní hodnota: |−${n}| = ${n} = ${C(Bn(n,4))} = <b>${H(n)}</b></li>
 <li>Dvojkový doplněk: invertuj bity a přičti 1: ~${Bn(n,4)} = ${Bn(15-n,4)}, +1 = ${C(Bn(16-n,4))} = <b>${H(16-n)}</b> <span style="color:#6a737b">(rychle: 16 − ${n} = ${16-n})</span></li>
 <li>Přímý kód: znaménkový bit 1 + absolutní hodnota na 3 bitech: ${C('1'+Bn(n,3))} = <b>${H(8+n)}</b> <span style="color:#6a737b">(8 + ${n} = ${8+n})</span></li>
 <li>Posunutí b=${b}: uloží se A + b = −${n} + ${b} = ${b-n} = ${C(Bn(b-n,4))} = <b>${H(b-n)}</b></li></ol>`}

/* ---------- generátory ---------- */
const GEN={
 qf(){const t=Math.random()<.5,s=t?pick(QF_T):pick(QF_F);
  return{type:'mc',pts:.5,html:`Pro zobrazení binárních čísel v pevné řádové čárce se používá formát Qm.f<br>kde<ul style="margin:8px 0"><li>${s}.</li></ul><div class="hint">Vyberte jednu z nabízených možností:</div>`,options:['Pravda.','Nepravda.'],correct:t?0:1,sol:QF_SOL}},
 formula(){const k=R(0,3);
  return{type:'mc',pts:1,html:`V teorii pevné řádové čárky a formátu Qm.f je dána následující formule:<div class="fm">${FORM[k]}</div>Uvedená formule se dá použit<div class="hint">Vyberte jednu z nabízených možností:</div>`,options:FOPT,correct:k,sol:FSOL[k]+FHINT}},
 byte(){const f=R(1,5),m=6-f,b=Math.random()<.65?R(128,255):R(1,127),r=s8(b)/2**f;
  return{type:'num',inline:true,pts:1,html:`Je daný byte a jeho hodnotu lze číst jako číslo s pevnou řádovou čárkou v Qm.f formátu.<br>Hodnotu bytu převeďte na realné desitkové číslo. Použijte desetinou tečku.<br><br>Hodnota bytu je 0x${H(b,2)}, formát je Q${m}.${f}.`,
  fields:[{label:'Reálné číslo je',kind:'dec',correct:String(r),suffix:'<sub>D</sub>'}],after:'(radix tečka)',sol:solByte(b,m,f)}},
 scale(){let m,f;do{m=R(2,7);f=R(2,7)}while(m===f);
  const c=`1/(2<sup>${f}</sup>)`,o=shuf([`2<sup>${m}</sup>`,`1/(2<sup>${m}</sup>)`,`2<sup>${f}</sup>`,c,`2<sup>${m+f}</sup>`,`1/(2<sup>${m+f}</sup>)`]);
  return{type:'mc',pts:.5,html:`Pro zobrazení čísel v binární pevné řádové čárce se používá formát<p><b>Q${m}.${f}</b></p>Potom hodnota měřítka je<div class="hint">Vyberte jednu z nabízených možností:</div>`,options:o,correct:o.indexOf(c),
  sol:`<p>Měřítko je dáno počtem bitů <b>zlomkové části f</b> (číslo za tečkou ve Q${m}.${f}): <b>2<sup>−f</sup> = 1/(2<sup>${f}</sup>)</b> = 1/${2**f}.</p><p>Číslo m (${m}) ani m+f s měřítkem nesouvisí.</p>`}},
 measure(){const k=R(1,5),q=R(1,40),n=q*2**k;
  return{type:'num',inline:true,pts:1,html:`Kolik je ${n} v měřítku 2<sup>-${k}</sup>?`,fields:[{label:'Hodnota je',kind:'dec',s:1,correct:String(q),suffix:'<sub>D</sub>.'}],
  sol:`<p>Hodnota v měřítku = číslo × měřítko: ${n} · 2<sup>−${k}</sup> = ${n} / ${2**k} = <b>${q}</b></p><p style="color:#6a737b">Binárně to je posun o ${k} bit${k===1?'':k<5?'y':'ů'} doprava: ${C(Bn(n))} → ${C(Bn(q))}.</p>`}},
 demorgan(){const [t,ok]=pick(DM);
  return{type:'mc',pts:1,html:`Podle De Morgana se ${t}.<div class="hint">Vyberte jednu z nabízených možností:</div>`,options:['Ano','Ne'],correct:ok?0:1,sol:dmSol(t,ok)}},
 add(){const a=R(0,15),b=R(0,15),s=(a+b)&15,N=s>>3&1,Z=s===0?1:0,V=(a>>3)===(b>>3)&&(s>>3)!==(a>>3)?1:0,Cc=a+b>15?1:0;
  return{type:'num',lbl:1,pts:1,html:`Jsou dána čísla <i>a</i> a <i>b</i>. Vypočtěte jejich součet na 4 bity, výsledek zobrazte jako číslo bez znaménka, jako dvojkový doplněk a nastavte příznaky NZVC.<br>Příznaky mají hodnotu 0 nebo 1.
  <div class="addop"><div>&nbsp;${Bn(a,4)}</div><div><u>+${Bn(b,4)}</u></div></div>`,
  fields:[{label:'Součet',kind:'bin',len:4,correct:Bn(s,4),suffix:'<sub>B</sub>'},
   {label:'Výsledek jako číslo bez znaménka',kind:'dec',s:1,correct:String(s),suffix:'<sub>D</sub>'},
   {label:'Výsledek jako číslo ve dvojkovém doplňku',kind:'dec',s:1,correct:String(s>7?s-16:s),suffix:'<sub>D</sub>'},
   {label:'Příznaky N =',s:1,kind:'bit',correct:String(N),suffix:','},{label:'Z =',s:1,kind:'bit',correct:String(Z),suffix:','},
   {label:'V =',s:1,kind:'bit',correct:String(V),suffix:','},{label:'C =',s:1,kind:'bit',correct:String(Cc),suffix:'.'}],sol:solAdd(a,b)}},
 neg(){const n=R(1,7),b=R(n,8);
  return{type:'num',pts:1,html:`Je dané decimální číslo -${n}.<br>Stanovte hodnotu skupiny 4 bitů jako hexa číslo, pokud číslo bude zobrazeno jako:`,
  fields:[{label:'Absolutní hodnota',kind:'hex1',s:1,correct:H(n),suffix:'<sub>H</sub>'},{label:'Dvojkový doplněk <sup>2</sup>A',kind:'hex1',s:1,correct:H(16-n),suffix:'<sub>H</sub>'},
   {label:'Přímý kód <sup>SM</sup>A',kind:'hex1',s:1,correct:H(8+n),suffix:'<sub>H</sub>'},{label:`S posunutím b=${b}; (<sup>P</sup>A)`,kind:'hex1',s:1,correct:H(b-n),suffix:'<sub>H</sub>'}],
  after:'Odpovídejte vždy jednou hexa číslicí.',lbl:1,sol:solNeg(n,b)}}
};
const ORDER=['qf','formula','byte','scale','measure','demorgan','add','neg'];
const NAMES={qf:'Formát Qm.f (pravda/nepravda)',formula:'Formule Qm.f (výběr)',byte:'Byte → reálné číslo v Qm.f',scale:'Měřítko formátu Qm.f',measure:'Hodnota v měřítku 2⁻ᵏ',
 demorgan:'De Morganovy zákony',add:'Součet na 4 bity a příznaky NZVC',neg:'Záporné číslo na 4 bitech (hexa)'};

/* ---------- stav ---------- */
const S={qs:[],ans:[],checked:[],cur:0,done:false,left:900,t:null,start:null,end:null,view:'home',practice:null};
const app=document.getElementById('app');
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fmtD=d=>d.toLocaleString('cs',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});

function newTest(type){
 S.practice=type||null;
 S.qs=type?Array.from({length:5},()=>GEN[type]()):shuf(ORDER).map(k=>GEN[k]());
 S.ans=S.qs.map(q=>q.type==='mc'?null:q.fields.map(()=>''));
 S.checked=S.qs.map(()=>false);S.cur=0;S.done=false;S.left=900;S.start=new Date();
 clearInterval(S.t);
 if(!type)S.t=setInterval(()=>{S.left--;if(S.left<=0)finish();else{const t=document.getElementById('tm');if(t)t.textContent=fmt(S.left)}},1000);
 S.view='test';render();window.scrollTo(0,0);
}
function finish(){clearInterval(S.t);S.done=true;S.end=new Date();S.view='review';render();window.scrollTo(0,0)}
function fOK(f,v){v=String(v??'').replace(/\s/g,'').toUpperCase();if(!v)return false;
 v=v.replace(/[−–]/g,'-');
 if(f.kind==='dec'){v=v.replace(',','.');return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(v)&&Math.abs(Number(v)-Number(f.correct))<1e-9}
 if(f.kind==='bit')return v===f.correct;
 if(f.kind==='hex1'){v=v.replace(/^0X/,'');return /^[0-9A-F]$/.test(v)&&v===f.correct}
 if(f.kind==='hex'){v=v.replace(/^0X/,'').replace(/^U\+/,'');return /^[0-9A-F]+$/.test(v)&&parseInt(v,16)===parseInt(f.correct,16)}
 if(f.kind==='bin')return /^[01]+$/.test(v)&&v.length<=f.len&&parseInt(v,2)===parseInt(f.correct,2);
 return v===String(f.correct).toUpperCase()}
function isRight(i){const q=S.qs[i],a=S.ans[i];return q.type==='mc'?a===q.correct:q.fields.every((f,k)=>fOK(f,a[k]))}
const score=()=>S.qs.reduce((s,q,i)=>s+(isRight(i)?q.pts:0),0);
const total=()=>S.qs.reduce((s,q)=>s+q.pts,0);

/* ---------- vykreslení ---------- */
function qBody(i,show){
 const q=S.qs[i],a=S.ans[i],lock=show;let h=`<div class="qt">${q.html}</div>`;
 if(q.type==='mc'){
  h+=q.options.map((o,k)=>`<label class="opt"><input type="radio" name="q${i}" ${a===k?'checked':''} ${lock?'disabled':''} onchange="S.ans[${i}]=${k};mark(${i})"> ${o}${show&&k===q.correct?' <span class="ok mark">✓</span>':''}${show&&a===k&&k!==q.correct?' <span class="bad mark">✗</span>':''}</label>`).join('');
  if(show&&!isRight(i))h+=`<div class="fb">Správná odpověď: <b>${q.options[q.correct]}</b></div>`;
 }else{
  const inp=q.fields.map((f,k)=>{const r=show&&fOK(f,a[k]);
   return `${f.label?`<span class="lbl">${f.label}</span>`:''}${f.pre||''}<input type="text" autocomplete="off" spellcheck="false" class="${f.s?'s ':''}${show?(r?'right':'wrong'):''}" value="${a[k].replace(/"/g,'&quot;')}" ${lock?'disabled':''} oninput="S.ans[${i}][${k}]=this.value;mark(${i})">${show?`<span class="${r?'ok':'bad'} mark">${r?'✓':'✗'}</span>`:''}${f.suffix?` ${f.suffix}`:''}`});
  if(q.mono)h+=`<div class="mono">${inp.map((x,k)=>(q.fields[k].sep?'<div class="sepl">-----------------------------</div>':'')+`<div class="row">${x}</div>`).join('')}</div>`;
  else h+=q.inline?`<div class="row">${inp.join(' ')}</div>`:`<div class="${q.lbl?'lb':''}">${inp.map(x=>`<div class="row">${x}</div>`).join('')}</div>`;
  if(q.after)h+=`<div class="qt after">${q.after}</div>`;
  if(show&&!isRight(i))h+=`<div class="fb">Správná odpověď: <b>${q.fields.map(f=>(f.pre||'')+f.correct).join(' … ')}</b></div>`;
 }
 if(show&&q.sol)h+=`<details class="sol" ${isRight(i)?'':'open'}><summary>Postup řešení</summary>${q.sol}</details>`;
 return h;
}
function mark(i){const b=document.querySelectorAll('.grid button')[i];if(b)b.classList.add('done')}
function qBlock(i,review){const q=S.qs[i],ok=isRight(i),show=review||S.checked[i];
 const st=show?(ok?'Správně':'Nesprávně'):'Nedokončeno',cls=show?(ok?'ok':'bad'):'';
 const bod=show?`Bodů ${pts(ok?q.pts:0)} / ${pts(q.pts)}`:`Počet bodů z ${pts(q.pts)}`;
 return `<section class="q"><div class="qh"><h2>Úloha <b>${i+1}</b></h2><span class="${cls}">${st}</span><span>${bod}</span></div>${qBody(i,show)}</section>`}
function navPanel(){return `<aside class="nav"><h3>Navigace testu</h3><div class="grid">${S.qs.map((q,i)=>{
  const filled=S.ans[i]!==null&&(q.type==='mc'||S.ans[i].some(x=>x));
  const cls=S.done?(isRight(i)?'r':'w'):(i===S.cur?'cur ':'')+(filled?'done':'');
  return `<button class="${cls}" onclick="go(${i})">${i+1}</button>`}).join('')}</div><p style="margin-top:16px">${S.done?`<a onclick="S.view='home';render()">Zpět na úvod</a>`:`<a onclick="if(confirm('Opravdu dokončit test?'))finish()">Konec testu…</a>`}</p></aside>`}
function go(i){S.cur=i;if(S.done)document.querySelectorAll('.q')[i].scrollIntoView({behavior:'smooth'});else render()}
function check(i){S.checked[i]=true;render()}

function theory(){
 const ex=(t,x)=>`<div class="ex"><b>${t}</b>${x}</div>`;
 return `<div class="th"><h3>1. Formát Qm.f (pevná řádová čárka)</h3>${QF_SOL}
 <p>Typické chytáky: „m značí počet bitů za radix tečkou“ ✗ (za tečkou je <b>f</b>), „f je celá část“ ✗.</p></div>
 <div class="th"><h3>2. Formule pro převod Qm.f → reálné číslo</h3>
 <table class="hx" style="font-family:inherit"><tr><td>formule</td><td>správná odpověď</td></tr>
 ${FORM.map((f,k)=>`<tr><td style="text-align:left"><span class="fm" style="margin:4px 0;font-size:18px;display:inline-block">${f}</span></td><td style="text-align:left">${['<i>a<sub>i</sub></i>, reálné, <b>se znaménkem</b>','<i>a<sub>i</sub></i>, reálné, <b>bez znaménka</b>','<i>b<sub>i</sub></i>, integer, <b>se znaménkem</b>','<i>b<sub>i</sub></i>, integer, <b>bez znaménka</b>'][k]}</td></tr>`).join('')}</table>${FHINT}</div>
 <div class="th"><h3>3. Měřítko a hodnota v měřítku</h3><p>Měřítko formátu Qm.f je <b>2<sup>−f</sup> = 1/2<sup>f</sup></b> (závisí jen na počtu bitů za tečkou).</p>
 <p>„Kolik je N v měřítku 2<sup>−k</sup>“ = N · 2<sup>−k</sup> = N / 2<sup>k</sup>. Např. 256 · 2<sup>−4</sup> = 256/16 = <b>16</b>, 128 · 2<sup>−4</sup> = <b>8</b>.</p></div>
 <div class="th"><h3>4. Byte → reálné číslo v Qm.f</h3><p>Byte přečti jako 8bitové číslo <b>se znaménkem</b> (dvojkový doplněk: je-li hodnota ≥ 0x80, odečti 256) a vyděl 2<sup>f</sup>.</p>
 ${ex('Příklad: 0xE6, Q4.2',solByte(0xE6,4,2))}${ex('Příklad: 0xE6, Q3.3',solByte(0xE6,3,3))}</div>
 <div class="th"><h3>5. De Morganovy zákony</h3>${DM_SOL}
 <table class="hx"><tr><td>věta „Podle De Morgana se … rovná …“</td><td>odpověď</td></tr>${DM.map(([t,o])=>`<tr><td style="text-align:left;font-family:inherit">${t}</td><td>${o?'Ano':'Ne'}</td></tr>`).join('')}</table></div>
 <div class="th"><h3>6. Součet na 4 bity a příznaky NZVC</h3>
 <p><b>N</b> = nejvyšší bit výsledku; <b>Z</b> = 1 jen pro výsledek 0000; <b>C</b> = přenos z nejvyššího bitu (součet bez znaménka &gt; 15); <b>V</b> = přetečení se znaménkem (výsledek mimo −8…7, tj. sečtu dvě čísla se stejným znaménkem a výsledek má opačné znaménko).</p>
 <p>Rozsahy na 4 bitech: bez znaménka 0…15, dvojkový doplněk −8…7 (hodnoty 8–15 znamenají −8…−1, tj. odečti 16).</p>
 ${ex('Příklad: 0011 + 0111',solAdd(3,7))}${ex('Příklad: 1100 + 0110',solAdd(12,6))}</div>
 <div class="th"><h3>7. Záporné číslo −N na 4 bitech</h3><p>Absolutní hodnota = N; dvojkový doplněk = 16 − N; přímý kód = 8 + N (znaménkový bit 1); posunutí b: b − N. Vše jako jedna hexa číslice.</p>
 ${ex('Příklad: −6, b = 6',solNeg(6,6))}</div>`;
}

function render(){
 if(S.view==='home'){
  app.innerHTML=`<div class="tabs"><a class="on">Test</a><a onclick="S.view='theory';render()">Jak to počítat (teorie)</a></div>
  <div class="info"><b>Pevná řádová čárka – formát Qm.f, měřítko, převod bytu na reálné číslo<br>De Morganovy zákony<br>Součet na 4 bity, příznaky NZVC, záporná čísla na 4 bitech</b></div>
  <button class="btn" onclick="newTest()">Pokus testu</button>
  <p style="margin-top:36px">Časový limit: 15 min.</p><p>Test má 8 úloh za 7 bodů. Hodnoty se při každém pokusu generují znovu a pořadí úloh se mění. Desetinná čísla můžete psát s tečkou i čárkou, hexa číslice velkými i malými písmeny.
  Po kliknutí na <b>Zkontrolovat</b> nebo na konci testu uvidíte u každé úlohy <b>postup řešení</b>.</p>
  <h3 style="margin-top:34px">Procvičování jednoho typu úloh</h3><p style="color:#6a737b;margin-top:0">5 úloh stejného typu, bez časového limitu.</p>
  ${ORDER.map(k=>`<button class="btn o" onclick="newTest('${k}')">${NAMES[k]}</button>`).join('')}`;
 }else if(S.view==='theory'){
  app.innerHTML=`<div class="tabs"><a onclick="S.view='home';render()">Test</a><a class="on">Jak to počítat (teorie)</a></div>`+theory();
 }else if(S.view==='test'){
  const i=S.cur;
  app.innerHTML=`<div class="layout"><div>${S.practice?`<p style="color:#6a737b">Procvičování: <b>${NAMES[S.practice]}</b></p>`:`<div style="text-align:right"><span class="timer">Zbývající čas <span id="tm">${fmt(S.left)}</span></span></div>`}${qBlock(i,false)}
  <button class="btn g" onclick="check(${i})">Zkontrolovat</button>
  <div class="foot"><span>${i>0?`<button class="btn g" onclick="go(${i-1})">Předchozí stránka</button>`:''}</span><span>${i<S.qs.length-1?`<button class="btn" onclick="go(${i+1})">Další stránka</button>`:`<button class="btn" onclick="if(confirm('Opravdu dokončit test?'))finish()">Dokončit pokus</button>`}</span></div></div>${navPanel()}</div>`;
 }else{
  const sc=score(),t=total(),dur=Math.round((S.end-S.start)/1000);
  app.innerHTML=`<div class="layout"><div><table class="sum">
  <tr><th>Stav</th><td>Dokončeno</td></tr><tr><th>Zahájení</th><td>${fmtD(S.start)}</td></tr><tr><th>Dokončeno</th><td>${fmtD(S.end)}</td></tr>
  <tr><th>Trvání</th><td>${dur>=60?Math.floor(dur/60)+' min. '+dur%60+' sekund':dur+' sekund'}</td></tr>
  <tr><th>Známka</th><td><b>${pts(sc)}</b> z možných ${pts(t)} (<b>${Math.round(sc/t*100)}</b>%)</td></tr></table>
  ${S.qs.map((_,i)=>qBlock(i,true)).join('')}<div class="foot"><button class="btn" onclick="newTest(S.practice)">Nový pokus</button></div></div>${navPanel()}</div>`;
 }
}
render();
</script>
</body>
</html>
