<header>
  <div class="crumbs"><a href="../../index.html?p=zds">← Výběr testu</a> &nbsp;|&nbsp; 440-2104/01 (2026/2027 ZS) / Příklady k procvičení / <b>Test – kódování znaků</b></div>
  <h1><i></i>Test – kódování znaků</h1>
</header>
<main id="app"></main>

<script>
/* ---------- pomocné ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const H=(n,d=0)=>n.toString(16).toUpperCase().padStart(d,'0');
const Bn=(n,d=0)=>n.toString(2).padStart(d,'0');
const g4=s=>s.replace(/\B(?=(.{4})+$)/g,' ');          // binární řetězec po 4 bitech zprava
const C=s=>`<code>${s}</code>`;
const pts=p=>p.toFixed(2).replace('.',',');
const par=x=>x<0?`(${x})`:x;

/* ---------- kódování ---------- */
function enc8(cp){
 if(cp<0x80)return[cp];
 if(cp<0x800)return[0xC0|cp>>6,0x80|cp&63];
 if(cp<0x10000)return[0xE0|cp>>12,0x80|(cp>>6)&63,0x80|cp&63];
 return[0xF0|cp>>18,0x80|(cp>>12)&63,0x80|(cp>>6)&63,0x80|cp&63];
}
function enc16(cp){const u=cp-0x10000;return[0xD800|u>>10,0xDC00|u&0x3FF]}
function randCp(n){
 if(n===2)return R(0x80,0x7FF);
 if(n===3){let c;do c=R(0x800,0xFFFF);while(c>=0xD800&&c<=0xDFFF);return c}
 return R(0x10000,0x10FFFF);
}

/* ---------- texty ---------- */
const UTF8TAB=`<table class="u8">
<tr><th></th><th></th><th colspan="4">Byty</th></tr>
<tr><th>Počet<br>bitů</th><th>Poslední<br>kódová<br>pozice</th><th>Vedoucí<br>(Leading)</th><th>Následný<br>(Continuation)</th><th>Následný<br>(Continuation)</th><th>Následný<br>(Continuation)</th></tr>
<tr><td>7</td><td>U+007F</td><td>0xxx xxxx</td><td></td><td></td><td></td></tr>
<tr><td>11</td><td>U+07FF</td><td>110x xxxx</td><td>10xx xxxx</td><td></td><td></td></tr>
<tr><td>16</td><td>U+FFFF</td><td>1110 xxxx</td><td>10xx xxxx</td><td>10xx xxxx</td><td></td></tr>
<tr><td>21</td><td>U+1FFFFF</td><td>1111 0xxx</td><td>10xx xxxx</td><td>10xx xxxx</td><td>10xx xxxx</td></tr></table>`;
const U16ALG=`<p>Algoritmus (RFC 2781) pro sestavení formátu UTF-16 pro kódovou pozici U větší než 0xFFFF je:</p>
<ol class="alg"><li>Vypočti U' = U - 0x1 0000.</li>
<li>Vypočtená hodnota U' se rozdělí na dva řetězce S1 a S2 po 10 bitech zprava.</li>
<li>Inicializují se dvě 16 bitová čísla, unsigned integer, W1 a W2, na hodnoty 0xD800 a 0xDC00. Každá hodnota má 6 bitový konstantní prefix zleva, a zbývajících 10 bitů v každé hodnotě je použito pro kódování.</li>
<li>10 nejvýznamnějších bitů 20 bitové hodnoty U' se nastaví do 10 bitů nejméně významových bitů čísla W1 (vedoucí slovo - leading word) a 10 nejméně významových bitů hodnoty U' se nastaví do 10 nejméně významových bitů čísla W2 (následné slovo - trailing word) a algoritmus končí.</li></ol>`;
const UNI_SOL=`<p>Unicode používá kódové pozice <b>0x0 až 0x10FFFF</b>.</p>
<p>To je <b>17 rovin</b> (planes, čísla 0x00–0x10) × <b>65 536</b> (= 2<sup>16</sup>) pozic v každé rovině = <b>1 114 112</b> kódových pozic.</p>
<p>Nejvyšší hodnota 0x10FFFF = ${C('1 0000 1111 1111 1111 1111')} má <b>21 bitů</b> → Unicode používá 21bitový prostor.
Horních 5 bitů je číslo roviny, dolních 16 bitů pozice v rovině (rovina 0 = BMP, U+0000–U+FFFF).</p>`;

/* ---------- postupy řešení ---------- */
function sol8enc(cp){
 const n=enc8(cp).length,bits=[7,11,16,21][n-1];
 const rng=['U+0000 – U+007F','U+0080 – U+07FF','U+0800 – U+FFFF','U+10000 – U+10FFFF'][n-1];
 const hexD=Math.ceil(bits/4),full=Bn(cp,hexD*4),s=Bn(cp,bits),lead=bits-6*(n-1);
 const ch=[s.slice(0,lead)];for(let i=lead;i<bits;i+=6)ch.push(s.slice(i,i+6));
 const pre=n===1?['0']:[['110','1110','11110'][n-2],...Array(n-1).fill('10')];
 const by=ch.map((c,i)=>pre[i]+c);
 return `<ol>
 <li>U+${H(cp,4)} leží v rozsahu ${rng} → podle tabulky řádek <b>${bits} bitů</b> → <b>${n} ${n===1?'bajt':n<5?'bajty':'bajtů'}</b>.</li>
 <li>Hexa → binárně (každá hexa číslice = 4 bity): 0x${H(cp,hexD)} = ${C(g4(full))}${full.length>bits?` → vezmeme ${bits} bitů: ${C(s)}`:''}</li>
 <li>Rozdělíme <b>zprava</b> po 6 bitech${n>1?`, na vedoucí bajt zbude ${lead} bitů`:''}: ${C(ch.join(' | '))}</li>
 <li>Doplníme do šablon (prefix <span class="pf">barevně</span>):<br>${by.map((b,i)=>`<code><span class="pf">${pre[i]}</span>${ch[i]}</code> = ${C(g4(b))} = <b>0x${H(parseInt(b,2),2)}</b>`).join('<br>')}</li>
 <li>Výsledek: <b>${enc8(cp).map(b=>'0x'+H(b,2)).join(' ')}</b></li></ol>`;
}
function sol8dec(by){
 const n=by.length,pl=n===1?1:n+1;
 const parts=by.map((b,i)=>{const s=Bn(b,8),k=i===0?pl:2;return{s,pre:s.slice(0,k),data:s.slice(k)}});
 const all=parts.map(p=>p.data).join(''),cp=parseInt(all,2);
 return `<ol>
 <li>Bajty převedeme do binárky: ${parts.map((p,i)=>`0x${H(by[i],2)} = ${C(g4(p.s))}`).join(', ')}</li>
 <li>Vedoucí bajt začíná ${C(parts[0].pre)} → sekvence má <b>${n} bajty</b>. Následné bajty začínají ${C('10')}.</li>
 <li>Odstraníme prefixy: ${parts.map(p=>`<code><span class="pf" style="text-decoration:line-through">${p.pre}</span>${p.data}</code>`).join(' ')}</li>
 <li>Datové bity spojíme: ${C(all)} (${all.length} bitů)</li>
 <li>Seskupíme po 4 bitech <b>zprava</b>: ${C(g4(all))} = 0x${H(cp)}</li>
 <li>Výsledek na 4 pozice: <b>U+${H(cp,4)}</b></li></ol>`;
}
function sol16enc(cp){
 const u=cp-0x10000,s=Bn(u,20),hi=u>>10,lo=u&1023,[w1,w2]=enc16(cp);
 return `<ol>
 <li>U' = U − 0x10000 = 0x${H(cp,5)} − 0x10000 = <b>0x${H(u,5)}</b> <span style="color:#6a737b">(stačí odečíst 1 od čísla před posledními 4 číslicemi)</span></li>
 <li>U' na 20 bitů: ${C(g4(s))}</li>
 <li>Rozdělíme na 2× 10 bitů: S1 = ${C(s.slice(0,10))}, S2 = ${C(s.slice(10))}</li>
 <li>S1 = ${C(g4(s.slice(0,10)))} = 0x${H(hi,3)} → W1 = 0xD800 + 0x${H(hi,3)} = <b>0x${H(w1,4)}</b></li>
 <li>S2 = ${C(g4(s.slice(10)))} = 0x${H(lo,3)} → W2 = 0xDC00 + 0x${H(lo,3)} = <b>0x${H(w2,4)}</b></li>
 <li>Výsledek: <b>0x${H(w1,4)} 0x${H(w2,4)}</b></li></ol>`;
}
function sol16dec(w1,w2){
 const hi=w1-0xD800,lo=w2-0xDC00,u=hi*1024+lo,cp=u+0x10000,s=Bn(hi,10)+Bn(lo,10);
 return `<ol>
 <li>S1 = W1 − 0xD800 = 0x${H(w1,4)} − 0xD800 = 0x${H(hi,3)} = ${C(Bn(hi,10))} (10 bitů)</li>
 <li>S2 = W2 − 0xDC00 = 0x${H(w2,4)} − 0xDC00 = 0x${H(lo,3)} = ${C(Bn(lo,10))} (10 bitů)</li>
 <li>Spojíme S1 S2 na 20 bitů: ${C(g4(s))} = U' = 0x${H(u,5)}</li>
 <li>U = U' + 0x10000 = 0x${H(u,5)} + 0x10000 = <b>U+${H(cp,5)}</b></li></ol>`;
}
function solOff(b,A,B){
 const bA=A+b,bB=B+b,s1=bA+bB,s1m=s1&15,nb=(~b)&15,t=(nb+1)&15,s2=s1m+t,S=s2&15;
 return `<ol>
 <li>V posunutí se číslo X uloží jako <b>X + b</b>:<br><sup>b</sup>A = ${par(A)} + ${b} = ${bA} = ${C(Bn(bA,4))}<br><sup>b</sup>B = ${par(B)} + ${b} = ${bB} = ${C(Bn(bB,4))}</li>
 <li>Binární součet: ${C(Bn(bA,4))} + ${C(Bn(bB,4))} = ${s1}${s1>15?` = ${C(Bn(s1,5))} → přenos z 4. bitu zahodíme →`:' ='} <b>${C(Bn(s1m,4))}</b></li>
 <li>V součtu je posunutí <b>dvakrát</b> (A+b + B+b), jedno b musíme odečíst = přičíst jeho dvojkový doplněk:<br>b = ${b} = ${C(Bn(b,4))}, ~b = ${C(Bn(nb,4))}, (~b)+1 = <b>${C(Bn(t,4))}</b></li>
 <li>${C(Bn(s1m,4))} + ${C(Bn(t,4))} = ${s2>15?`${C(Bn(s2,5))} → přenos zahodíme → `:''}<b>${C(Bn(S,4))}</b></li>
 <li>Kontrola: A + B = ${A+B}, v posunutí ${par(A+B)} + ${b} = ${S} = ${C(Bn(S,4))} ✓</li></ol>`;
}

/* ---------- výběrové otázky ---------- */
const UNI_Q='Unicode je mezinárodní standard pro kódování znaků a platí:';
const UNI_A={t:['Současná verze Unicode používá 21 bitový prostor pro kódování všech znaků.',
  'Současná verze Unicode využívá rozsah 0 až 0x10FFFF pro všechny kódové pozice.',
  'Současná verze Unicode dokáže zakódovat 1 114 112 kódových pozic, znaků.'],
 f:['Současná verze Unicode používá 32 bitový prostor pro kódování všech znaků.',
  'Současná verze Unicode využívá rozsah 0 až 0xFFFF pro všechny kódové pozice.',
  'Současná verze Unicode využívá rozsah 0 až 0xFF pro všechny kódové pozice.',
  'Současná verze Unicode dokáže zakódovat 2<sup>16</sup> = 65 536 kódových pozic, znaků.',
  'Současná verze Unicode používá 16 bitový prostor pro kódování všech znaků.',
  'Současná verze Unicode využívá rozsah 0 až 0xFFFF FFFF pro všechny kódové pozice.']};
const UNI_B={t:['Současná verze Unicode má 17 rovin (planes).',
  'Současná verze Unicode používá roviny o velikosti 65 536 kódových pozic.',
  'Současná verze Unicode používá roviny o velikosti odpovídajícím 16 bitům.'],
 f:['Současná verze Unicode má 32 rovin (planes).',
  'Současná verze Unicode používá roviny o velikosti odpovídajícím 8 bitům.',
  'Současná verze Unicode používá roviny o velikosti 1 114 112 kódových pozic.',
  'Současná verze Unicode má roviny o rozsahu 0x0 až 0xFFFF FFFF kódových pozic.',
  'Současná verze Unicode má 16 rovin (planes).',
  'Současná verze Unicode má 256 rovin (planes).']};
const mcUni=P=>{const c=pick(P.t),o=shuf([c,...shuf(P.f).slice(0,4)]);
 return{type:'mc',pts:.5,html:UNI_Q+'<div class="hint">Vyberte jednu z nabízených možností:</div>',options:o,correct:o.indexOf(c),sol:UNI_SOL}};

/* ---------- generátory ---------- */
const GEN={
 u16dec(){const cp=R(0x10000,0x10FFFF),[w1,w2]=enc16(cp);
  return{type:'num',inline:true,pts:1,html:U16ALG+`<hr class="blue"><p>Je dána sekvence slov ve formátu UTF-16: <b>0x${H(w1,4)} 0x${H(w2,4)}</b>. Určete kódovou pozici v Unicode.</p>`,
  fields:[{label:'Kódová pozice je U+',kind:'hex',correct:H(cp,5)}],sol:sol16dec(w1,w2)}},
 u8enc(){const cp=randCp(pick([2,2,2,3,3,4])),by=enc8(cp);
  return{type:'num',inline:true,pts:2,html:UTF8TAB+`<p>Pro kódovou pozici U+${H(cp,4)} sestavte UTF-8 formát</p>`,
  fields:by.map(b=>({pre:'0x',kind:'hex',s:1,correct:H(b,2)})),sol:sol8enc(cp)}},
 u8dec(){const cp=randCp(pick([2,2,3])),by=enc8(cp);
  return{type:'num',inline:true,pts:1,html:UTF8TAB+`<p>Pro zápis ve formátu UTF-8 sestavte kódovou pozici v Unicode.</p><p>Správna kódová pozice je na 4 pozice.</p>`,
  fields:[{label:`UTF-8 : ${by.map(b=>'0x'+H(b,2)).join(' ')} → U+`,kind:'hex',correct:H(cp,4)}],sol:sol8dec(by)}},
 uniA(){return mcUni(UNI_A)},
 uniB(){return mcUni(UNI_B)},
 offset(){const b=R(3,8);let A,B;do{A=R(-b,15-b);B=R(-b,15-b)}while(A+B+b<0||A+B+b>15);
  const S=A+B+b,bb=x=>Bn(x,4);
  return{type:'num',mono:true,pts:1,html:`<p>Operace součtu při zobrazení čísel pomocí posunutí je dána vzorcem</p><p><sup>b</sup><i>S</i> = <sup>b</sup><i>A</i> + <sup>b</sup><i>B</i> + (~<i>b</i>) + 1.</p>
  <p>Vypočtěte součet dvou čísel v posunutí, kde hodnota posunutí je <i>b</i>=${b}.</p><p>Čísla jsou A = ${A}, B = ${B}. Všechny se provádějí ve 4 bitech a odpovědi jsou v binárním tvaru.</p>`,
  fields:[{label:'operand <sup>b</sup><i>A</i>',pre:'B(',suffix:')',kind:'bin',len:4,correct:bb(A+b)},
   {label:'operand <sup>b</sup><i>B</i>',pre:'B(',suffix:')',kind:'bin',len:4,correct:bb(B+b)},
   {sep:1,label:'binární součet',pre:'B(',suffix:')',kind:'bin',len:4,correct:bb((A+B+2*b)&15)},
   {label:'(~<i>b</i>) + 1',pre:'B(',suffix:')',kind:'bin',len:4,correct:bb(((~b)+1)&15)},
   {sep:1,label:'Součet <sup>b</sup>S',pre:'B(',suffix:')',kind:'bin',len:4,correct:bb(S)}],sol:solOff(b,A,B)}},
 ascii(){const t=pick([0,0,1,2,2,2]);const head='ASCII kód byl definován v roce 1963 a poslední modifikace je z roku 1986. ';
  if(t===0)return{type:'num',inline:true,pts:.5,html:head+'Kolika bitový je to kód.',
   fields:[{label:'Originální ASCII kód je',s:1,suffix:'bitový.',correct:'7'}],
   sol:'<p>Originální ASCII je <b>7bitový</b> (2<sup>7</sup> = 128 znaků, 0x00–0x7F). 8. bit využívají až různá „rozšířená ASCII“ (např. ISO 8859-2, CP1250).</p>'};
  if(t===1)return{type:'num',inline:true,pts:.5,html:head+'Kolik různých znaků (kódových pozic) obsahuje?',
   fields:[{label:'Originální ASCII kód obsahuje',s:1,suffix:'znaků.',correct:'128'}],
   sol:'<p>ASCII je 7bitový → 2<sup>7</sup> = <b>128</b> znaků (0–127, z toho 0–31 a 127 jsou řídicí znaky).</p>'};
  const k=pick(['U','L','D']);let ch,sol;
  if(k==='U'){const i=R(0,25);ch=String.fromCharCode(65+i);sol=`'A' = 0x41 (65). Písmeno „${ch}“ je o ${i} dál → 65 + ${i} = ${65+i} = <b>0x${H(65+i,2)}</b>`}
  else if(k==='L'){const i=R(0,25);ch=String.fromCharCode(97+i);sol=`'a' = 0x61 (97) = 'A' + 0x20. Písmeno „${ch}“ je o ${i} dál → 97 + ${i} = ${97+i} = <b>0x${H(97+i,2)}</b>`}
  else{const i=R(0,9);ch=String(i);sol=`'0' = 0x30. Číslice ${i} → 0x30 + ${i} = <b>0x${H(48+i,2)}</b>`}
  return{type:'num',inline:true,pts:.5,html:`Jaký je ASCII kód znaku <b>„${ch}“</b>? Odpověď zapište hexadecimálně (dvě číslice).`,
   fields:[{label:'Kód je',pre:'0x',s:1,kind:'hex',correct:H(ch.charCodeAt(0),2)}],sol:`<p>${sol}</p><p>Zapamatuj si: 'A' = 0x41, 'a' = 0x61, '0' = 0x30, mezera = 0x20.</p>`}},
 u16enc(){const cp=R(0x10000,0x10FFFF),[w1,w2]=enc16(cp);
  return{type:'num',inline:true,pts:2,html:U16ALG+`<hr class="blue">`,
  fields:[{label:`Pro kódovou pozici U+${H(cp,5)} sestavte UTF-16 formát. Potom sekvence slov v UTF-16 formátu je`,pre:'0x',kind:'hex',correct:H(w1,4)},
   {pre:'0x',kind:'hex',suffix:'.',correct:H(w2,4)}],sol:sol16enc(cp)}}
};
const ORDER=['u16dec','u8enc','u8dec','uniA','uniB','offset','ascii','u16enc'];
const NAMES={u16dec:'UTF-16 → kódová pozice',u8enc:'Kódová pozice → UTF-8',u8dec:'UTF-8 → kódová pozice',uniA:'Unicode – rozsah (výběr)',
 uniB:'Unicode – roviny (výběr)',offset:'Součet v posunutí',ascii:'ASCII',u16enc:'Kódová pozice → UTF-16'};

/* ---------- stav ---------- */
const S={qs:[],ans:[],checked:[],cur:0,done:false,left:1200,t:null,start:null,end:null,view:'home',practice:null};
const app=document.getElementById('app');
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fmtD=d=>d.toLocaleString('cs',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});

function newTest(type){
 S.practice=type||null;
 S.qs=type?Array.from({length:5},()=>GEN[type]()):ORDER.map(k=>GEN[k]());
 S.ans=S.qs.map(q=>q.type==='mc'?null:q.fields.map(()=>''));
 S.checked=S.qs.map(()=>false);S.cur=0;S.done=false;S.left=1200;S.start=new Date();
 clearInterval(S.t);
 if(!type)S.t=setInterval(()=>{S.left--;if(S.left<=0)finish();else{const t=document.getElementById('tm');if(t)t.textContent=fmt(S.left)}},1000);
 S.view='test';render();window.scrollTo(0,0);
}
function finish(){clearInterval(S.t);S.done=true;S.end=new Date();S.view='review';render();window.scrollTo(0,0)}
function fOK(f,v){v=String(v??'').replace(/\s/g,'').toUpperCase();if(!v)return false;
 if(f.kind==='hex'){v=v.replace(/^0X/,'').replace(/^U\+/,'');return /^[0-9A-F]+$/.test(v)&&parseInt(v,16)===parseInt(f.correct,16)}
 if(f.kind==='bin')return /^[01]+$/.test(v)&&v.length<=f.len&&parseInt(v,2)===parseInt(f.correct,2);
 return v===String(f.correct).toUpperCase()}
function isRight(i){const q=S.qs[i],a=S.ans[i];return q.type==='mc'?a===q.correct:q.fields.every((f,k)=>fOK(f,a[k]))}
const score=()=>S.qs.reduce((s,q,i)=>s+(isRight(i)?q.pts:0),0);
const total=()=>S.qs.reduce((s,q)=>s+q.pts,0);

/* ---------- vykreslení ---------- */
function qBody(i,show){
 const q=S.qs[i],a=S.ans[i],lock=show;let h=`<div class="qt">${q.html}</div>`;
 if(q.type==='mc'){
  h+=q.options.map((o,k)=>`<label class="opt"><input type="radio" name="q${i}" ${a===k?'checked':''} ${lock?'disabled':''} onchange="S.ans[${i}]=${k};mark(${i})"> ${o}${show&&k===q.correct?' <span class="ok mark">✓</span>':''}${show&&a===k&&k!==q.correct?' <span class="bad mark">✗</span>':''}</label>`).join('');
  if(show&&!isRight(i))h+=`<div class="fb">Správná odpověď: <b>${q.options[q.correct]}</b></div>`;
 }else{
  const inp=q.fields.map((f,k)=>{const r=show&&fOK(f,a[k]);
   return `${f.label?`<span class="lbl">${f.label}</span>`:''}${f.pre||''}<input type="text" autocomplete="off" spellcheck="false" class="${f.s?'s ':''}${show?(r?'right':'wrong'):''}" value="${a[k].replace(/"/g,'&quot;')}" ${lock?'disabled':''} oninput="S.ans[${i}][${k}]=this.value;mark(${i})">${show?`<span class="${r?'ok':'bad'} mark">${r?'✓':'✗'}</span>`:''}${f.suffix?` ${f.suffix}`:''}`});
  if(q.mono)h+=`<div class="mono">${inp.map((x,k)=>(q.fields[k].sep?'<div class="sepl">-----------------------------</div>':'')+`<div class="row">${x}</div>`).join('')}</div>`;
  else h+=q.inline?`<div class="row">${inp.join(' ')}</div>`:inp.map(x=>`<div class="row">${x}</div>`).join('');
  if(q.after)h+=`<div class="qt after">${q.after}</div>`;
  if(show&&!isRight(i))h+=`<div class="fb">Správná odpověď: <b>${q.fields.map(f=>(f.pre||'')+f.correct).join(' … ')}</b></div>`;
 }
 if(show&&q.sol)h+=`<details class="sol" ${isRight(i)?'':'open'}><summary>Postup řešení</summary>${q.sol}</details>`;
 return h;
}
function mark(i){const b=document.querySelectorAll('.grid button')[i];if(b)b.classList.add('done')}
function qBlock(i,review){const q=S.qs[i],ok=isRight(i),show=review||S.checked[i];
 const st=show?(ok?'Správně':'Nesprávně'):'Nedokončeno',cls=show?(ok?'ok':'bad'):'';
 const bod=show?`Bodů ${pts(ok?q.pts:0)} / ${pts(q.pts)}`:`Počet bodů z ${pts(q.pts)}`;
 return `<section class="q"><div class="qh"><h2>Úloha <b>${i+1}</b></h2><span class="${cls}">${st}</span><span>${bod}</span></div>${qBody(i,show)}</section>`}
function navPanel(){return `<aside class="nav"><h3>Navigace testu</h3><div class="grid">${S.qs.map((q,i)=>{
  const filled=S.ans[i]!==null&&(q.type==='mc'||S.ans[i].some(x=>x));
  const cls=S.done?(isRight(i)?'r':'w'):(i===S.cur?'cur ':'')+(filled?'done':'');
  return `<button class="${cls}" onclick="go(${i})">${i+1}</button>`}).join('')}</div><p style="margin-top:16px">${S.done?`<a onclick="S.view='home';render()">Zpět na úvod</a>`:`<a onclick="if(confirm('Opravdu dokončit test?'))finish()">Konec testu…</a>`}</p></aside>`}
function go(i){S.cur=i;if(S.done)document.querySelectorAll('.q')[i].scrollIntoView({behavior:'smooth'});else render()}
function check(i){S.checked[i]=true;render()}

function theory(){
 const hx=`<table class="hx"><tr>${[...Array(16)].map((_,i)=>`<td>${H(i)}</td>`).join('')}</tr><tr>${[...Array(16)].map((_,i)=>`<td>${Bn(i,4)}</td>`).join('')}</tr></table>`;
 return `<div class="th"><h3>0. Hexa ↔ binárně</h3><p>Každá hexa číslice odpovídá přesně 4 bitům. Při převodu binárky na hexa se vždy seskupuje <b>zprava</b> po 4 bitech.</p>${hx}</div>
 <div class="th"><h3>1. Unicode – rozsah a roviny</h3>${UNI_SOL}
 <p>Typické chytáky: 32 bitů ✗, 0xFFFF ✗ (to je jen rovina 0 / UCS-2), 65 536 pozic celkem ✗ (to je velikost <i>jedné</i> roviny), roviny po 1 114 112 ✗ (to je <i>celý</i> Unicode).</p></div>
 <div class="th"><h3>2. ASCII</h3><p>Originální ASCII (1963, poslední úprava 1986) je <b>7bitový</b> → 128 znaků. 'A' = 0x41, 'a' = 0x61, '0' = 0x30, mezera = 0x20. Malá písmena = velká + 0x20.</p></div>
 <div class="th"><h3>3. Kódová pozice → UTF-8</h3>${UTF8TAB}
 <p>Postup: podle velikosti kódové pozice najdi řádek tabulky (počet bajtů), převeď číslo do binárky na daný počet bitů, rozděl <b>zprava</b> po 6 bitech a doplň do šablon <code>110…</code>/<code>1110…</code>/<code>11110…</code> a <code>10…</code>.</p>
 <div class="ex"><b>Příklad (2 bajty): U+0740</b>${sol8enc(0x740)}</div>
 <div class="ex"><b>Příklad (3 bajty): U+20AC (€)</b>${sol8enc(0x20AC)}</div></div>
 <div class="th"><h3>4. UTF-8 → kódová pozice</h3><p>Obrácený postup: bajty do binárky, podle vedoucího bajtu zjisti délku, odstraň prefixy, zbytek spoj a přečti jako hexa (po 4 bitech zprava).</p>
 <div class="ex"><b>Příklad: 0xCA 0xAC</b>${sol8dec([0xCA,0xAC])}</div></div>
 <div class="th"><h3>5. UTF-16 (náhradní páry – surrogate pairs)</h3><p>Pro U &gt; 0xFFFF: U' = U − 0x10000 (20 bitů), horních 10 bitů přičti k 0xD800 (W1), dolních 10 bitů k 0xDC00 (W2). Pro U ≤ 0xFFFF je UTF-16 prostě jedno slovo = U.</p>
 <div class="ex"><b>Příklad: U+E013A</b>${sol16enc(0xE013A)}</div>
 <div class="ex"><b>Zpětně: 0xDB40 0xDD3A</b>${sol16dec(0xDB40,0xDD3A)}</div></div>
 <div class="th"><h3>6. Součet čísel v posunutí (excess-b)</h3><p>Číslo X se uloží jako X + b. Když sečteš <sup>b</sup>A + <sup>b</sup>B, dostaneš A + B + <b>2b</b>, takže jedno b je navíc. Odečíst b = přičíst jeho dvojkový doplněk (~b) + 1. Vše se počítá na 4 bitech, přenos z nejvyššího bitu se zahazuje.</p>
 <div class="ex"><b>Příklad: b = 6, A = 3, B = 3</b>${solOff(6,3,3)}</div></div>`;
}

function render(){
 if(S.view==='home'){
  app.innerHTML=`<div class="tabs"><a class="on">Test</a><a onclick="S.view='theory';render()">Jak to počítat (teorie)</a></div>
  <div class="info"><b>Unicode, ASCII<br>UTF-8 a UTF-16 – kódování a dekódování<br>Součet čísel v kódu posunutí</b></div>
  <button class="btn" onclick="newTest()">Pokus testu</button>
  <p style="margin-top:36px">Časový limit: 20 min.</p><p>Test má 8 úloh za 8,5 bodu. Hodnoty se při každém pokusu generují znovu. Hexa číslice můžete psát velkými i malými písmeny, prefix 0x / U+ je nepovinný.
  Po kliknutí na <b>Zkontrolovat</b> nebo na konci testu uvidíte u každé úlohy <b>postup řešení</b>.</p>
  <h3 style="margin-top:34px">Procvičování jednoho typu úloh</h3><p style="color:#6a737b;margin-top:0">5 úloh stejného typu, bez časového limitu.</p>
  ${ORDER.map(k=>`<button class="btn o" onclick="newTest('${k}')">${NAMES[k]}</button>`).join('')}`;
 }else if(S.view==='theory'){
  app.innerHTML=`<div class="tabs"><a onclick="S.view='home';render()">Test</a><a class="on">Jak to počítat (teorie)</a></div>`+theory();
 }else if(S.view==='test'){
  const i=S.cur;
  app.innerHTML=`<div class="layout"><div>${S.practice?`<p style="color:#6a737b">Procvičování: <b>${NAMES[S.practice]}</b></p>`:`<div style="text-align:right"><span class="timer">Zbývající čas <span id="tm">${fmt(S.left)}</span></span></div>`}${qBlock(i,false)}
  <button class="btn g" onclick="check(${i})">Zkontrolovat</button>
  <div class="foot"><span>${i>0?`<button class="btn g" onclick="go(${i-1})">Předchozí stránka</button>`:''}</span><span>${i<S.qs.length-1?`<button class="btn" onclick="go(${i+1})">Další stránka</button>`:`<button class="btn" onclick="if(confirm('Opravdu dokončit test?'))finish()">Dokončit pokus</button>`}</span></div></div>${navPanel()}</div>`;
 }else{
  const sc=score(),t=total(),dur=Math.round((S.end-S.start)/1000);
  app.innerHTML=`<div class="layout"><div><table class="sum">
  <tr><th>Stav</th><td>Dokončeno</td></tr><tr><th>Zahájení</th><td>${fmtD(S.start)}</td></tr><tr><th>Dokončeno</th><td>${fmtD(S.end)}</td></tr>
  <tr><th>Trvání</th><td>${dur>=60?Math.floor(dur/60)+' min. '+dur%60+' sekund':dur+' sekund'}</td></tr>
  <tr><th>Známka</th><td><b>${pts(sc)}</b> z možných ${pts(t)} (<b>${Math.round(sc/t*100)}</b>%)</td></tr></table>
  ${S.qs.map((_,i)=>qBlock(i,true)).join('')}<div class="foot"><button class="btn" onclick="newTest(S.practice)">Nový pokus</button></div></div>${navPanel()}</div>`;
 }
}
render();
</script>
</body>
</html>
