<script>
/* ---------- pomocné ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const H=(n,d=0)=>n.toString(16).toUpperCase().padStart(d,'0');
const Bn=(n,d=0)=>n.toString(2).padStart(d,'0');
const g4=s=>s.replace(/\B(?=(.{4})+$)/g,' ');          // binární řetězec po 4 bitech zprava
const C=s=>`<code>${s}</code>`;
const pts=p=>p.toFixed(2).replace('.',',');
const par=x=>x<0?`(${x})`:x;

/* ---------- čísla ---------- */
const E=[10,12,15,18,22,27,33,39,47,56,63,68,82,100,120,150,180,220,270,330,390,470,560,680,820];
const ER=(a,b)=>pick(E.filter(x=>x>=a&&x<=b));
const N3=x=>(Math.round(x*1000)/1000).toFixed(3).replace('.',',');
const Nf=(x,d=4)=>{const s=Number(x.toPrecision(6));return String(Math.round(s*10**d)/10**d).replace('.',',')};
const Om=v=>`${Nf(v,3)} Ω`;
const it=(s,sub)=>`<i>${s}</i>${sub?`<sub>${sub}</sub>`:''}`;
const RR=k=>it('R',k);

/* ---------- kreslení obvodů (SVG) ---------- */
const sv={
 w:(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`,
 dot:(x,y)=>`<circle cx="${x}" cy="${y}" r="3.2" fill="#000" stroke="none"/>`,
 t:(x,y,s,sub,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-style="italic">${s}${sub?`<tspan font-size="10" dy="3" font-style="normal">${sub}</tspan>`:''}</text>`,
 rv(x,y1,y2,lab,sub,side='l'){const m=(y1+y2)/2;return this.w(x,y1,x,m-27)+this.w(x,m+27,x,y2)+`<rect x="${x-9}" y="${m-27}" width="18" height="54" fill="#fff"/>`+(lab?this.t(side==='l'?x-15:x+15,m+4,lab,sub,side==='l'?'end':'start'):'')},
 rh(x1,x2,y,lab,sub,side='b'){const m=(x1+x2)/2;return this.w(x1,y,m-27,y)+this.w(m+27,y,x2,y)+`<rect x="${m-27}" y="${y-9}" width="54" height="18" fill="#fff"/>`+(lab?this.t(m,side==='b'?y+27:y-15,lab,sub):'')},
 srcv(x,y1,y2){const m=(y1+y2)/2;return this.w(x,y1,x,m-17)+this.w(x,m+17,x,y2)+`<circle cx="${x}" cy="${m}" r="17" fill="#fff"/>`},
 srch(x1,x2,y){const m=(x1+x2)/2;return this.w(x1,y,m-17,y)+this.w(m+17,y,x2,y)+`<circle cx="${m}" cy="${y}" r="17" fill="#fff"/>`},
 /* šipka napětí (plná) / proudu zdroje (prázdná hlavička) */
 arr(x1,y1,x2,y2,open){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,bx=x2-ux*9,by=y2-uy*9,px=-uy*4.5,py=ux*4.5;
  return this.w(x1,y1,bx,by)+`<path d="M${x2} ${y2}L${bx+px} ${by+py}L${bx-px} ${by-py}Z" fill="${open?'#fff':'#000'}"/>`},
 svg(w,h,c){return `<svg class="ckt" viewBox="-30 -10 ${w+70} ${h+40}" width="${w+70}" height="${h+40}"><g stroke="#000" stroke-width="1.6" fill="none">${c.filter(x=>!x.startsWith('<text')).join('')}</g><g font-family="Times New Roman,serif" font-size="15" fill="#000">${c.filter(x=>x.startsWith('<text')).join('')}</g></svg>`}
};
const SV=(w,h,parts)=>{const all=parts.join('').match(/<text[\s\S]*?<\/text>|<(?:line|circle|rect|path)[^>]*\/?>(?:<\/\w+>)?/g);return sv.svg(w,h,all)};

const CKT={
 d1:()=>SV(330,220,[sv.srcv(70,20,215),sv.arr(48,104,48,132,true),sv.t(34,122,'I','i','end'),sv.w(70,20,320,20),sv.w(70,215,320,215),
   sv.rv(170,20,120,'R','1'),sv.w(170,120,245,120),sv.rv(170,120,215,'R','2'),sv.rv(245,120,215,'R','3'),sv.rv(320,20,215,'R','4','r'),
   sv.dot(170,20),sv.dot(170,120),sv.dot(170,215),sv.dot(245,215)]),
 d2:()=>SV(350,200,[sv.srcv(60,30,190),sv.arr(38,96,38,124),sv.t(26,116,'U','i','end'),sv.w(60,30,120,30),sv.w(120,30,120,80),
   sv.rh(120,200,30,'R','1'),sv.rh(200,280,30,'R','2'),sv.rh(120,280,80,'R','3'),sv.w(280,30,280,80),sv.w(280,30,340,30),
   sv.rv(340,30,190,'R','4','r'),sv.w(60,190,340,190),sv.dot(120,30),sv.dot(280,30)]),
 t1:()=>SV(330,240,[sv.w(60,20,320,20),sv.rv(60,20,130,'R','1'),sv.rv(190,20,130,'R','2'),sv.rv(320,20,130,'R','3'),
   sv.rh(60,190,130,'R','4'),sv.rh(190,320,130,'R','5'),sv.w(60,130,60,235),sv.w(320,130,320,235),sv.srch(60,320,235),
   sv.arr(176,207,204,207),sv.t(190,198,'U','i'),sv.dot(190,20),sv.dot(60,130),sv.dot(190,130),sv.dot(320,130)]),
 t2:()=>SV(330,285,[sv.srcv(60,20,145),sv.arr(40,96,40,68,true),sv.t(30,90,'I','i1','end'),sv.w(60,20,320,20),
   sv.rv(190,20,145,'R','2'),sv.rv(320,20,145,'R','3'),sv.rh(60,190,145,'R','4'),sv.rh(190,320,145,'R','5'),
   sv.w(60,145,60,270),sv.w(320,145,320,270),sv.rh(60,320,270,'R','6'),sv.dot(190,20),sv.dot(60,145),sv.dot(190,145),sv.dot(320,145)]),
 s:(up)=>SV(290,120,[sv.srcv(50,20,110),sv.arr(28,52,28,80),sv.t(18,72,'U','i1','end'),sv.rh(50,150,20,'R','i1'),sv.w(150,20,245,20),
   sv.rv(150,20,110,'R','','l'),sv.rv(205,20,110,'R','i2'),sv.srcv(245,20,110),up?sv.arr(268,80,268,52,true):sv.arr(268,52,268,80,true),sv.t(278,72,'I','i2','start'),
   sv.w(50,110,245,110),sv.dot(150,20),sv.dot(205,20),sv.dot(150,110),sv.dot(205,110)])
};

/* ---------- výpočty ---------- */
const par2=(a,b)=>a*b/(a+b);
const num=(v,unit)=>({type:'num',pts:4,inline:true,fields:[{label:'Odpověď:',kind:'num',s:0,correct:N3(v)}],unitNote:unit});
const DY=(a,b,c)=>{const s=a+b+c;return[a*b/s,a*c/s,b*c/s]};   // trojúhelník → hvězda

const GEN={
 delic(){
  if(Math.random()<.5){const R1=ER(100,820),R2=ER(150,820),R3=ER(100,680),R4=ER(470,820)*pick([1,1,3]),Ii=R(2,10);
   const R23=par2(R2,R3),R123=R1+R23,I1=Ii*R4/(R4+R123),P=R1*I1*I1/1000;
   return{...num(P),html:`Určete hodnotu výkonu rezistoru ${RR(1)}, znáte-li ${RR(1)} = ${R1} Ω, ${RR(2)} = ${R2} Ω, ${RR(3)} = ${R3} Ω, ${RR(4)} = ${R4} Ω, ${it('I','i')} = ${Ii} A. Výsledek uveďte v jednotce (kW).<div class="cbox">${CKT.d1()}</div>`,
    sol:`<ol><li>${RR(2)} a ${RR(3)} jsou paralelně: ${RR(23)} = ${RR(2)}·${RR(3)}/(${RR(2)}+${RR(3)}) = ${R2}·${R3}/${R2+R3} = <b>${Om(R23)}</b></li>
    <li>Větev s ${RR(1)}: ${RR(1)} + ${RR(23)} = ${R1} + ${Nf(R23,3)} = <b>${Om(R123)}</b>; ta je paralelně s ${RR(4)}.</li>
    <li>Dělič proudu: ${it('I',1)} = ${it('I','i')} · ${RR(4)} / (${RR(4)} + ${RR(123)}) = ${Ii} · ${R4} / ${Nf(R4+R123,3)} = <b>${Nf(I1)} A</b></li>
    <li>${it('P',1)} = ${RR(1)} · ${it('I',1)}² = ${R1} · ${Nf(I1)}² = ${Nf(P*1000,3)} W = <b>${N3(P)} kW</b></li></ol>`}}
  const R1=ER(10,330),R2=ER(10,330),R3=ER(47,470),R4=ER(47,470),Ui=pick([5,9,10,12,15,24]);
  const R12=R1+R2,Rp=par2(R12,R3),U3=Ui*Rp/(Rp+R4),P=U3*U3/R3*1000;
  return{...num(P),html:`Určete výkon rezistoru ${RR(3)}, znáte-li ${RR(1)} = ${R1} Ω, ${RR(2)} = ${R2} Ω, ${RR(3)} = ${R3} Ω, ${RR(4)} = ${R4} Ω, ${it('U','i')} = ${Ui} V. Výsledek uveďte v jednotce (mW).<div class="cbox">${CKT.d2()}</div>`,
   sol:`<ol><li>${RR(1)} a ${RR(2)} jsou v sérii: ${RR(12)} = ${R1} + ${R2} = <b>${R12} Ω</b></li>
   <li>${RR(12)} je paralelně s ${RR(3)}: ${RR('p')} = ${R12}·${R3}/(${R12}+${R3}) = <b>${Om(Rp)}</b></li>
   <li>Dělič napětí (${RR('p')} v sérii s ${RR(4)}): ${it('U',3)} = ${it('U','i')} · ${RR('p')} / (${RR('p')} + ${RR(4)}) = ${Ui} · ${Nf(Rp,3)} / ${Nf(Rp+R4,3)} = <b>${Nf(U3)} V</b></li>
   <li>${it('P',3)} = ${it('U',3)}² / ${RR(3)} = ${Nf(U3)}² / ${R3} = ${Nf(P/1000,6)} W = <b>${N3(P)} mW</b></li></ol>`}},
 trans(){
  if(Math.random()<.5){const R1=ER(10,100),R2=ER(10,100),R3=ER(10,100),R4=ER(10,100),R5=ER(10,100),Ui=pick([5,10,12,15,24]);
   const [RT,Rb,Rc]=(()=>{const s=R2+R3+R5;return[R2*R3/s,R2*R5/s,R3*R5/s]})(),A=R1+RT,B=R4+Rb,Rp=par2(A,B),I=Ui/(Rp+Rc),I4=I*A/(A+B),P=R4*I4*I4*1000;
   return{...num(P),html:`Určete hodnotu výkonu rezistoru ${RR(4)}, znáte-li ${RR(1)} = ${R1} Ω, ${RR(2)} = ${R2} Ω, ${RR(3)} = ${R3} Ω, ${RR(4)} = ${R4} Ω, ${RR(5)} = ${R5} Ω, ${it('U','i')} = ${Ui} V. Výsledek uveďte v jednotce (mW). Číselnou hodnotu zadejte bez jednotky s přesností na 3 desetinná místa.<div class="cbox">${CKT.t1()}</div>`,
    sol:`<p>Trojúhelník ${RR(2)}, ${RR(3)}, ${RR(5)} (mezi horním uzlem, středem a pravým uzlem) převedeme na hvězdu se středem S (${RR(4)} zůstane zachován):</p>
    <ol><li>Σ = ${RR(2)} + ${RR(3)} + ${RR(5)} = ${R2+R3+R5} Ω</li>
    <li>${RR('h')} = ${RR(2)}${RR(3)}/Σ = ${Om(RT)} (k hornímu uzlu), ${RR('s')} = ${RR(2)}${RR(5)}/Σ = ${Om(Rb)} (ke střednímu uzlu), ${RR('p')} = ${RR(3)}${RR(5)}/Σ = ${Om(Rc)} (k pravému uzlu)</li>
    <li>Z levého uzlu vedou do S dvě paralelní cesty: ${RR(1)} + ${RR('h')} = <b>${Om(A)}</b> a ${RR(4)} + ${RR('s')} = <b>${Om(B)}</b> → paralelně ${Om(Rp)}</li>
    <li>Celkový odpor: ${Nf(Rp,3)} + ${RR('p')} = ${Om(Rp+Rc)}, proud zdroje ${it('I')} = ${Ui} / ${Nf(Rp+Rc,3)} = <b>${Nf(I,5)} A</b></li>
    <li>Dělič proudu: ${it('I',4)} = ${it('I')} · ${Nf(A,3)} / (${Nf(A,3)} + ${Nf(B,3)}) = <b>${Nf(I4,6)} A</b></li>
    <li>${it('P',4)} = ${RR(4)} · ${it('I',4)}² = ${R4} · ${Nf(I4,6)}² = <b>${N3(P)} mW</b></li></ol>`}}
  const R2=ER(22,180),R3=ER(22,180),R4=ER(22,180),R5=ER(22,180),R6=ER(22,180),Ii=pick([0.1,0.12,0.15,0.2,0.24,0.25,0.3,0.4,0.5]);
  const s=R4+R5+R6,Ra=R4*R6/s,Rb=R4*R5/s,Rc=R5*R6/s,A=R2+Rb,B=R3+Rc,I2=Ii*B/(A+B),P=R2*I2*I2*1000;
  return{...num(P),html:`Určete hodnotu výkonu rezistoru ${RR(2)}, znáte-li ${RR(2)} = ${R2} Ω, ${RR(3)} = ${R3} Ω, ${RR(4)} = ${R4} Ω, ${RR(5)} = ${R5} Ω, ${RR(6)} = ${R6} Ω, ${it('I','i')} = ${String(Ii).replace('.',',')} A. Výsledek uveďte v jednotce (mW). Číselnou hodnotu zadejte bez jednotky s přesností na 3 desetinná místa.<div class="cbox">${CKT.t2()}</div>`,
   sol:`<p>Trojúhelník ${RR(4)}, ${RR(5)}, ${RR(6)} (mezi levým, středním a pravým uzlem) převedeme na hvězdu se středem S:</p>
   <ol><li>Σ = ${RR(4)} + ${RR(5)} + ${RR(6)} = ${s} Ω</li>
   <li>${RR('l')} = ${RR(4)}${RR(6)}/Σ = ${Om(Ra)} (k levému uzlu), ${RR('s')} = ${RR(4)}${RR(5)}/Σ = ${Om(Rb)} (ke střednímu uzlu), ${RR('p')} = ${RR(5)}${RR(6)}/Σ = ${Om(Rc)} (k pravému uzlu)</li>
   <li>Proud zdroje teče z horního uzlu do S dvěma paralelními cestami: ${RR(2)} + ${RR('s')} = <b>${Om(A)}</b> a ${RR(3)} + ${RR('p')} = <b>${Om(B)}</b> (pak přes ${RR('l')} zpět do zdroje – na rozdělení proudu nemá vliv)</li>
   <li>Dělič proudu: ${it('I',2)} = ${it('I','i')} · ${Nf(B,3)} / (${Nf(A,3)} + ${Nf(B,3)}) = <b>${Nf(I2,6)} A</b></li>
   <li>${it('P',2)} = ${RR(2)} · ${it('I',2)}² = ${R2} · ${Nf(I2,6)}² = <b>${N3(P)} mW</b></li></ol>`}},
 super(){
  const up=Math.random()<.5,Ui=pick([10,12,15,20,24,30,48,50,60]),Ri1=ER(15,560),Rr=ER(39,560),Ri2=ER(39,560),Rp=par2(Rr,Ri2),U1=Ui*Rp/(Ri1+Rp),Rall=1/(1/Ri1+1/Rr+1/Ri2);
  const cand=[0.05,0.1,0.15,0.2,0.25,0.3,0.4,0.5,0.6,0.8,1,1.2,1.5,2,2.2,2.5,3].filter(x=>x*Rall>=0.2*U1&&x*Rall<=1.6*U1),Ii=cand.length?pick(cand):0.1;
  const U2=(up?1:-1)*Ii*Rall,U=U1+U2,P=U*U/Rr;
  return{...num(P),html:`Určete výkon rezistoru ${it('R')}, znáte-li ${it('U','i1')} = ${Ui} V, ${RR('i1')} = ${Ri1} Ω, ${it('R')} = ${Rr} Ω, ${it('I','i2')} = ${String(Ii).replace('.',',')} A, ${RR('i2')} = ${Ri2} Ω. Výsledek uveďte v jednotce (W).<div class="cbox">${CKT.s(up)}</div>`,
   sol:`<p>Napětí na ${it('R')} (horní uzel proti dolnímu) určíme superpozicí:</p><ol>
   <li><b>Jen zdroj napětí</b> (zdroj proudu rozpojen): ${it('R')} ∥ ${RR('i2')} = ${Om(Rp)}; dělič napětí ${it("U'")} = ${Ui} · ${Nf(Rp,3)} / (${Ri1} + ${Nf(Rp,3)}) = <b>${Nf(U1)} V</b> (šipka ${it('U','i1')} dolů → horní svorka je +)</li>
   <li><b>Jen zdroj proudu</b> (zdroj napětí zkratován): ${RR('i1')} ∥ ${it('R')} ∥ ${RR('i2')} = ${Om(Rall)}; ${it("U''")} = ${up?'+':'−'}${String(Ii).replace('.',',')} · ${Nf(Rall,3)} = <b>${Nf(U2)} V</b> (šipka ${it('I','i2')} ${up?'nahoru → proud teče do horního uzlu, napětí se <b>přičítá</b>':'dolů → proud z horního uzlu odtéká, napětí se <b>odečítá</b>'})</li>
   <li>${it('U','R')} = ${it("U'")} + ${it("U''")} = ${Nf(U1)} ${U2<0?'−':'+'} ${Nf(Math.abs(U2))} = <b>${Nf(U)} V</b></li>
   <li>${it('P')} = ${it('U','R')}² / ${it('R')} = ${Nf(U)}² / ${Rr} = <b>${N3(P)} W</b></li></ol>
   <p style="color:#6a737b">Pozor: výkon se superpozicí <b>nesčítá</b> – nejdřív sečti napětí (nebo proudy), teprve pak spočítej výkon.</p>`}}
};
for(const k in GEN){const f=GEN[k];GEN[k]=()=>{let q;do{q=f()}while(Number(q.fields[0].correct.replace(',','.'))<0.01);return q}}
const ORDER=['delic','trans','super'];
const NAMES={delic:'Děliče',trans:'Transfigurace',super:'Superpozice'};

/* ---------- stav ---------- */
const S={qs:[],ans:[],checked:[],cur:0,done:false,left:1800,t:null,start:null,end:null,view:'home',practice:null};
const app=document.getElementById('app');
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fmtD=d=>d.toLocaleString('cs',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});

function newTest(type){
 S.practice=type||null;
 S.qs=type?Array.from({length:6},()=>GEN[type]()):ORDER.map(k=>GEN[k]());
 S.ans=S.qs.map(q=>q.type==='mc'?null:q.fields.map(()=>''));
 S.checked=S.qs.map(()=>false);S.cur=0;S.done=false;S.left=1800;S.start=new Date();
 clearInterval(S.t);
 if(!type)S.t=setInterval(()=>{S.left--;if(S.left<=0)finish();else{const t=document.getElementById('tm');if(t)t.textContent=fmt(S.left)}},1000);
 S.view='test';render();window.scrollTo(0,0);
}
function finish(){clearInterval(S.t);S.done=true;S.end=new Date();S.view='review';render();window.scrollTo(0,0)}
function fOK(f,v){v=String(v??'').replace(/\s/g,'').toUpperCase();if(!v)return false;
 v=v.replace(/[−–]/g,'-');
 if(f.kind==='num'){v=v.replace(',','.');if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(v))return false;const c=Number(f.correct.replace(',','.'));return Math.abs(Number(v)-c)<=Math.max(0.0015,Math.abs(c)*0.002)}
 if(f.kind==='dec'){v=v.replace(',','.');return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(v)&&Math.abs(Number(v)-Number(f.correct))<1e-9}
 if(f.kind==='bit')return v===f.correct;
 if(f.kind==='hex1'){v=v.replace(/^0X/,'');return /^[0-9A-F]$/.test(v)&&v===f.correct}
 if(f.kind==='hex'){v=v.replace(/^0X/,'').replace(/^U\+/,'');return /^[0-9A-F]+$/.test(v)&&parseInt(v,16)===parseInt(f.correct,16)}
 if(f.kind==='bin')return /^[01]+$/.test(v)&&v.length<=f.len&&parseInt(v,2)===parseInt(f.correct,2);
 return v===String(f.correct).toUpperCase()}
function isRight(i){const q=S.qs[i],a=S.ans[i];return q.type==='mc'?a===q.correct:q.fields.every((f,k)=>fOK(f,a[k]))}
const score=()=>S.qs.reduce((s,q,i)=>s+(isRight(i)?q.pts:0),0);
const total=()=>S.qs.reduce((s,q)=>s+q.pts,0);

/* ---------- vykreslení ---------- */
function qBody(i,show){
 const q=S.qs[i],a=S.ans[i],lock=show;let h=`<div class="qt">${q.html}</div>`;
 if(q.type==='mc'){
  h+=q.options.map((o,k)=>`<label class="opt"><input type="radio" name="q${i}" ${a===k?'checked':''} ${lock?'disabled':''} onchange="S.ans[${i}]=${k};mark(${i})"> ${o}${show&&k===q.correct?' <span class="ok mark">✓</span>':''}${show&&a===k&&k!==q.correct?' <span class="bad mark">✗</span>':''}</label>`).join('');
  if(show&&!isRight(i))h+=`<div class="fb">Správná odpověď: <b>${q.options[q.correct]}</b></div>`;
 }else{
  const inp=q.fields.map((f,k)=>{const r=show&&fOK(f,a[k]);
   return `${f.label?`<span class="lbl">${f.label}</span>`:''}${f.pre||''}<input type="text" autocomplete="off" spellcheck="false" class="${f.s?'s ':''}${show?(r?'right':'wrong'):''}" value="${a[k].replace(/"/g,'&quot;')}" ${lock?'disabled':''} oninput="S.ans[${i}][${k}]=this.value;mark(${i})">${show?`<span class="${r?'ok':'bad'} mark">${r?'✓':'✗'}</span>`:''}${f.suffix?` ${f.suffix}`:''}`});
  if(q.mono)h+=`<div class="mono">${inp.map((x,k)=>(q.fields[k].sep?'<div class="sepl">-----------------------------</div>':'')+`<div class="row">${x}</div>`).join('')}</div>`;
  else h+=q.inline?`<div class="row">${inp.join(' ')}</div>`:`<div class="${q.lbl?'lb':''}">${inp.map(x=>`<div class="row">${x}</div>`).join('')}</div>`;
  if(q.after)h+=`<div class="qt after">${q.after}</div>`;
  if(show&&!isRight(i))h+=`<div class="fb">Správná odpověď: <b>${q.fields.map(f=>(f.pre||'')+f.correct).join(' … ')}</b></div>`;
 }
 if(show&&q.sol)h+=`<details class="sol" ${isRight(i)?'':'open'}><summary>Postup řešení</summary>${q.sol}</details>`;
 return h;
}
function mark(i){const b=document.querySelectorAll('.grid button')[i];if(b)b.classList.add('done')}
function qBlock(i,review){const q=S.qs[i],ok=isRight(i),show=review||S.checked[i];
 const st=show?(ok?'Správně':'Nesprávně'):'Nedokončeno',cls=show?(ok?'ok':'bad'):'';
 const bod=show?`Bodů ${pts(ok?q.pts:0)} / ${pts(q.pts)}`:`Počet bodů z ${pts(q.pts)}`;
 return `<section class="q"><div class="qh"><h2>Úloha <b>${i+1}</b></h2><span class="${cls}">${st}</span><span>${bod}</span></div>${qBody(i,show)}</section>`}
function navPanel(){return `<aside class="nav"><h3>Navigace testu</h3><div class="grid">${S.qs.map((q,i)=>{
  const filled=S.ans[i]!==null&&(q.type==='mc'||S.ans[i].some(x=>x));
  const cls=S.done?(isRight(i)?'r':'w'):(i===S.cur?'cur ':'')+(filled?'done':'');
  return `<button class="${cls}" onclick="go(${i})">${i+1}</button>`}).join('')}</div><p style="margin-top:16px">${S.done?`<a onclick="S.view='home';render()">Zpět na úvod</a>`:`<a onclick="if(confirm('Opravdu dokončit test?'))finish()">Konec testu…</a>`}</p></aside>`}
function go(i){S.cur=i;if(S.done)document.querySelectorAll('.q')[i].scrollIntoView({behavior:'smooth'});else render()}
function check(i){S.checked[i]=true;render()}

function theory(){
 const ex=(t,x)=>`<div class="ex"><b>${t}</b>${x}</div>`;
 return `<div class="th"><h3>Výkon rezistoru</h3><p>${it('P')} = ${it('R')}·${it('I')}² = ${it('U')}²/${it('R')} = ${it('U')}·${it('I')}. Pozor na jednotky: 1 kW = 1000 W, 1 W = 1000 mW. Výsledek se zadává bez jednotky, desetinnou čárkou, na 3 desetinná místa.</p></div>
 <div class="th"><h3>1. Děliče</h3>
 <p><b>Sériové spojení</b> ${RR('s')} = ${RR(1)} + ${RR(2)}; <b>paralelní</b> ${RR('p')} = ${RR(1)}${RR(2)}/(${RR(1)} + ${RR(2)}).</p>
 <p><b>Dělič napětí</b> (dva odpory v sérii na napětí ${it('U')}): ${it('U',1)} = ${it('U')} · ${RR(1)}/(${RR(1)} + ${RR(2)}).</p>
 <p><b>Dělič proudu</b> (dvě paralelní větve s celkovým proudem ${it('I')}): ${it('I',1)} = ${it('I')} · ${RR(2)}/(${RR(1)} + ${RR(2)}) – v čitateli je odpor té <b>druhé</b> větve.</p>
 <p>Postup: obvod postupně zjednodušuj (sériově/paralelně), dokud nezjistíš proud nebo napětí hledaného rezistoru, pak ${it('P')} = ${it('R')}${it('I')}² nebo ${it('U')}²/${it('R')}.</p>
 <div class="figs">${CKT.d1()}${CKT.d2()}</div></div>
 <div class="th"><h3>2. Transfigurace (trojúhelník → hvězda)</h3>
 <p>Trojúhelník odporů ${RR('ab')}, ${RR('bc')}, ${RR('ca')} mezi uzly a, b, c nahradíme hvězdou se středem S:</p>
 <p>${RR('a')} = ${RR('ab')}${RR('ca')}/Σ, &nbsp; ${RR('b')} = ${RR('ab')}${RR('bc')}/Σ, &nbsp; ${RR('c')} = ${RR('bc')}${RR('ca')}/Σ, &nbsp; kde Σ = ${RR('ab')} + ${RR('bc')} + ${RR('ca')}</p>
 <p>(odpor ramene hvězdy = součin dvou odporů trojúhelníku, které se v tom uzlu stýkají, děleno součtem všech tří).</p>
 <p>Volíme trojúhelník, který <b>neobsahuje hledaný rezistor</b> – ten pak v obvodu zůstane a jeho proud spočítáme děličem proudu. Obvod se po transfiguraci rozpadne na sérioparalelní.</p>
 <p>Opačný převod hvězda → trojúhelník: ${RR('ab')} = ${RR('a')} + ${RR('b')} + ${RR('a')}${RR('b')}/${RR('c')} (atd.).</p>
 <div class="figs">${CKT.t1()}${CKT.t2()}</div></div>
 <div class="th"><h3>3. Superpozice</h3>
 <p>V lineárním obvodu s více zdroji je proud (napětí) každého prvku součtem příspěvků od jednotlivých zdrojů, když ostatní zdroje vyřadíme: <b>zdroj napětí → zkrat</b>, <b>zdroj proudu → rozpojení</b>.</p>
 <p>U zadání ${it('U','i1')}, ${RR('i1')} ∥ ${it('R')} ∥ ${RR('i2')} ∥ ${it('I','i2')}:</p>
 <ul><li>od zdroje napětí: ${it("U'")} = ${it('U','i1')} · (${it('R')} ∥ ${RR('i2')}) / (${RR('i1')} + ${it('R')} ∥ ${RR('i2')})</li>
 <li>od zdroje proudu: ${it("U''")} = ±${it('I','i2')} · (${RR('i1')} ∥ ${it('R')} ∥ ${RR('i2')}) – znaménko podle šipky ${it('I','i2')}: nahoru (do horního uzlu) +, dolů −</li>
 <li>${it('P')} = (${it("U'")} + ${it("U''")})² / ${it('R')} – výkony se nesčítají!</li></ul>
 <div class="figs">${CKT.s(false)}${CKT.s(true)}</div>
 <p style="color:#6a737b">Šipka napětí zdroje ${it('U','i1')} míří od + k − (horní svorka je kladná).</p></div>`;
}

function render(){
 if(S.view==='home'){
  app.innerHTML=`<div class="tabs"><a class="on">Test</a><a onclick="S.view='theory';render()">Jak to počítat (teorie)</a></div>
  <div class="info"><b>Děliče napětí a proudu<br>Transfigurace trojúhelník → hvězda<br>Superpozice</b></div>
  <button class="btn" onclick="newTest()">Pokus testu</button>
  <p style="margin-top:36px">Časový limit: 30 min.</p><p>Test má 3 úlohy po 4 bodech (celkem 12 bodů). Každá úloha má dvě varianty zapojení, která z nich padne, se vybírá náhodně, a hodnoty součástek se při každém pokusu generují znovu.
  Výsledek zadávejte bez jednotky s přesností na 3 desetinná místa (desetinná čárka i tečka fungují).
  Po kliknutí na <b>Zkontrolovat</b> nebo na konci testu uvidíte u každé úlohy <b>postup řešení</b>.</p>
  <h3 style="margin-top:34px">Procvičování jednoho typu úloh</h3><p style="color:#6a737b;margin-top:0">6 úloh stejného typu (obě varianty zapojení), bez časového limitu.</p>
  ${ORDER.map(k=>`<button class="btn o" onclick="newTest('${k}')">${NAMES[k]}</button>`).join('')}`;
 }else if(S.view==='theory'){
  app.innerHTML=`<div class="tabs"><a onclick="S.view='home';render()">Test</a><a class="on">Jak to počítat (teorie)</a></div>`+theory();
 }else if(S.view==='test'){
  const i=S.cur;
  app.innerHTML=`<div class="layout"><div>${S.practice?`<p style="color:#6a737b">Procvičování: <b>${NAMES[S.practice]}</b></p>`:`<div style="text-align:right"><span class="timer">Zbývající čas <span id="tm">${fmt(S.left)}</span></span></div>`}${qBlock(i,false)}
  <button class="btn g" onclick="check(${i})">Zkontrolovat</button>
  <div class="foot"><span>${i>0?`<button class="btn g" onclick="go(${i-1})">Předchozí stránka</button>`:''}</span><span>${i<S.qs.length-1?`<button class="btn" onclick="go(${i+1})">Další stránka</button>`:`<button class="btn" onclick="if(confirm('Opravdu dokončit test?'))finish()">Dokončit pokus</button>`}</span></div></div>${navPanel()}</div>`;
 }else{
  const sc=score(),t=total(),dur=Math.round((S.end-S.start)/1000);
  app.innerHTML=`<div class="layout"><div><table class="sum">
  <tr><th>Stav</th><td>Dokončeno</td></tr><tr><th>Zahájení</th><td>${fmtD(S.start)}</td></tr><tr><th>Dokončeno</th><td>${fmtD(S.end)}</td></tr>
  <tr><th>Trvání</th><td>${dur>=60?Math.floor(dur/60)+' min. '+dur%60+' sekund':dur+' sekund'}</td></tr>
  <tr><th>Známka</th><td><b>${pts(sc)}</b> z možných ${pts(t)} (<b>${Math.round(sc/t*100)}</b>%)</td></tr></table>
  ${S.qs.map((_,i)=>qBlock(i,true)).join('')}<div class="foot"><button class="btn" onclick="newTest(S.practice)">Nový pokus</button></div></div>${navPanel()}</div>`;
 }
}
render();
</script>
</body>
</html>
