<script>
/* =================== pomocné funkce =================== */
const g=9.81, PI=Math.PI;
const Ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const Rd=(a,b,s)=>Math.round((Ri(Math.round(a/s),Math.round(b/s))*s)*1000)/1000;
const pick=a=>a[Ri(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const rad=d=>d*PI/180;
/* číslo česky */
function N(x,d){if(!isFinite(x))return '—';if(Math.abs(x)<1e-10)x=0;
 if(d===undefined){const a=Math.abs(x);d=a>=1000?1:a>=100?2:a>=1?3:4}
 const s=x.toLocaleString('cs',{maximumFractionDigits:d,useGrouping:Math.abs(x)>=10000});
 return s.replace('-','−')}
const V=a=>'('+a.map(x=>N(x)).join('; ')+')';
const len=a=>Math.sqrt(a.reduce((s,x)=>s+x*x,0));
const T1='<i>t</i>',T2='<i>t</i><sup>2</sup>',T3='<i>t</i><sup>3</sup>';
/* polynom: [[koef, proměnná],...] */
function poly(tt){let s='';tt.forEach(([c,v],i)=>{if(!c)return;const neg=c<0,a=Math.abs(c);
 const cs=(a===1&&v)?'':N(a);s+=(s?(neg?' − ':' + '):(neg?'−':''))+cs+v});return s||'0'}
const vec3=(a,b,c)=>poly([[a,'<b><i>i</i></b>']])+(b?(b<0?' − ':' + ')+poly([[Math.abs(b),'<b><i>j</i></b>']]):'')+(c?(c<0?' − ':' + ')+poly([[Math.abs(c),'<b><i>k</i></b>']]):'');
const kmh=v=>v/3.6;

/* =================== grafy (SVG) =================== */
const S=(f,a,b,n=140)=>Array.from({length:n+1},(_,i)=>{const t=a+(b-a)*i/n;return[t,f(t)]});
const COL=['#008a82','#c2185b','#3b5bdb'];
function plot(o){
 const W=o.w||300,H=o.h||170,m={l:34,r:22,t:16,b:22};
 const xs=[],ys=[];o.s.forEach(s=>s.forEach(([x,y])=>{xs.push(x);ys.push(y)}));(o.marks||[]).forEach(([x,y])=>{xs.push(x);ys.push(y)});
 let x0=Math.min(0,...xs),x1=Math.max(0,...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys);
 if(x1-x0<1e-9)x1=x0+1;if(y1-y0<1e-9){y1+=1;y0-=(y0<0?1:0)}
 const dy=(y1-y0)*.1;y1+=dy;if(y0<0)y0-=dy;
 const X=x=>m.l+(x-x0)/(x1-x0)*(W-m.l-m.r),Y=y=>H-m.b-(y-y0)/(y1-y0)*(H-m.t-m.b);
 const ax=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)+12}" y2="${Y(0)}" stroke="#555" marker-end="url(#ar)"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)-8}" stroke="#555" marker-end="url(#ar)"/>`;
 const lb=`<text x="${X(x1)+8}" y="${Y(0)+15}" font-size="12" text-anchor="end" fill="#333">${o.xl||'t'}</text><text x="${X(0)+6}" y="${m.t-3}" font-size="12" fill="#333">${o.yl||''}</text>`;
 const ps=o.s.map((s,i)=>`<path d="M${s.map(([x,y])=>X(x).toFixed(1)+' '+Y(y).toFixed(1)).join('L')}" fill="none" stroke="${COL[i%3]}" stroke-width="2"/>`).join('');
 const mk=(o.marks||[]).map(([x,y,t,pos])=>`<line x1="${X(x)}" y1="${Y(y)}" x2="${X(x)}" y2="${Y(0)}" stroke="#aaa" stroke-dasharray="3 3"/><circle cx="${X(x)}" cy="${Y(y)}" r="3.5" fill="#c2185b"/>${t?`<text x="${X(x)+(pos==='l'?-5:5)}" y="${Y(y)+(y<0?14:-6)}" font-size="11" fill="#c2185b" text-anchor="${pos==='l'?'end':'start'}">${t}</text>`:''}`).join('');
 return `<svg class="plot" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>${ax}${ps}${mk}${lb}</svg>`;
}
const fig=(svg,c)=>`<figure>${svg}<figcaption>${c||''}</figcaption></figure>`;
const figs=a=>`<div class="figs">${a.join('')}</div>`;


const CIRC=`<svg class="plot" viewBox="0 0 240 220" width="240" height="220"><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<line x1="20" y1="110" x2="225" y2="110" stroke="#555" marker-end="url(#a2)"/><line x1="120" y1="205" x2="120" y2="10" stroke="#555" marker-end="url(#a2)"/>
<circle cx="120" cy="110" r="75" fill="none" stroke="#008a82" stroke-width="2"/><line x1="120" y1="110" x2="173" y2="57" stroke="#c2185b" stroke-width="2"/><circle cx="173" cy="57" r="4" fill="#c2185b"/>
<path d="M150 110 A30 30 0 0 0 141 89" fill="none" stroke="#333"/><text x="153" y="100" font-size="12">φ = ωt</text><text x="138" y="78" font-size="12" fill="#c2185b">R</text>
<line x1="173" y1="57" x2="173" y2="110" stroke="#aaa" stroke-dasharray="3 3"/><text x="160" y="125" font-size="11">x = R cos ωt</text><text x="178" y="52" font-size="11">[x; y]</text><text x="215" y="125" font-size="12">x</text><text x="126" y="18" font-size="12">y</text></svg>`;
const INCL=`<svg class="plot" viewBox="0 0 340 230" width="340" height="230"><defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<polygon points="20,210 320,210 320,40" fill="#f1f3f5" stroke="#555"/><path d="M80 210 A60 60 0 0 0 72.2 180.5" fill="none" stroke="#333"/><text x="86" y="203" font-size="13">α</text>
<g transform="translate(182,99) rotate(-29.5)"><rect x="-26" y="-17" width="52" height="34" fill="#d9f0ee" stroke="#008a82"/></g>
<g stroke-width="2" marker-end="url(#a3)"><line x1="182" y1="99" x2="182" y2="184" stroke="#c2185b"/><line x1="182" y1="99" x2="130" y2="128" stroke="#3b5bdb"/><line x1="182" y1="99" x2="218" y2="163" stroke="#3b5bdb"/><line x1="182" y1="99" x2="146" y2="35" stroke="#3b5bdb"/><line x1="205" y1="86" x2="244" y2="64" stroke="#e67700"/></g>
<text x="188" y="196" font-size="12" fill="#c2185b">G = mg</text><text x="124" y="138" font-size="12" fill="#3b5bdb" text-anchor="end">G∥ = mg sin α</text><text x="224" y="172" font-size="12" fill="#3b5bdb">G⊥ = mg cos α</text><text x="140" y="30" font-size="12" fill="#3b5bdb" text-anchor="end">N = mg cos α</text><text x="248" y="60" font-size="12" fill="#e67700">F<tspan font-size="9" dy="3">t</tspan><tspan dy="-3"> = f·mg cos α</tspan></text></svg>`;
const THEORY=`
<div class="th"><h3>Kinematika přímočarého pohybu</h3>
<p class="f">v = dx/dt, &nbsp; a = dv/dt = d²x/dt²; &nbsp; obráceně x = ∫v dt, v = ∫a dt (integrační konstanty = počáteční podmínky x<sub>0</sub>, v<sub>0</sub>)</p>
<table class="t"><tr><th>pohyb</th><th>a</th><th>v(t)</th><th>x(t)</th></tr>
<tr><td>rovnoměrný</td><td>0</td><td>v<sub>0</sub></td><td>x<sub>0</sub> + v<sub>0</sub>t</td></tr>
<tr><td>rovnoměrně zrychlený</td><td>konst.</td><td>v<sub>0</sub> + at</td><td>x<sub>0</sub> + v<sub>0</sub>t + ½at²</td></tr>
<tr><td>rovnoměrně zpomalený</td><td>−a</td><td>v<sub>0</sub> − at</td><td>x<sub>0</sub> + v<sub>0</sub>t − ½at²</td></tr></table>
<div class="ex"><b>Užitečné vztahy bez času:</b> <span class="f">v² − v<sub>0</sub>² = 2as</span>; brzdění do zastavení <span class="f">t = v<sub>0</sub>/a, s = v<sub>0</sub>²/(2a)</span>; rozjezd z klidu <span class="f">s = ½at² = vt/2</span>.<br><b>Převod:</b> km/h ÷ 3,6 = m/s.</div>
<p>Typ pohybu poznáme ze zrychlení: a = 0 → rovnoměrný; a = konst. → rovnoměrně zrychlený/zpomalený; a závisí na t → nerovnoměrně zrychlený.</p></div>

<div class="th"><h3>Pohyb v rovině a prostoru</h3>
<p class="f">r⃗(t) = x(t)<b><i>i</i></b> + y(t)<b><i>j</i></b> + z(t)<b><i>k</i></b>, &nbsp; v⃗ = dr⃗/dt = (ẋ; ẏ; ż), &nbsp; a⃗ = dv⃗/dt</p>
<p class="f">|v| = √(v<sub>x</sub>² + v<sub>y</sub>² + v<sub>z</sub>²)</p>
<p><b>Trajektorie:</b> z jedné rovnice vyjádříme t a dosadíme do druhé (vyloučení parametru).</p>
<p>Derivace: <span class="f">(tⁿ)′ = n tⁿ⁻¹, (sin ωt)′ = ω cos ωt, (cos ωt)′ = −ω sin ωt</span>, konstanta → 0.</p></div>

<div class="th"><h3>Pohyb po kružnici</h3>
<p class="f">φ – úhlová dráha [rad], &nbsp; ω = dφ/dt [rad/s], &nbsp; ε = dω/dt [rad/s²]</p>
<p class="f">ω = 2π/T = 2πf, &nbsp; f [Hz] = (ot/min)/60, &nbsp; v = ωR</p>
<p class="f">a<sub>t</sub> = dv/dt = εR (tečné – mění velikost rychlosti), &nbsp; a<sub>n</sub> = v²/R = ω²R (normálové, dostředivé – mění směr), &nbsp; a = √(a<sub>t</sub>² + a<sub>n</sub>²)</p>
<p>Rovnoměrný pohyb po kružnici: ε = 0, a<sub>t</sub> = 0, a = a<sub>n</sub>. Rovnoměrně zrychlený: <span class="f">ω = ω<sub>0</sub> + εt, φ = ω<sub>0</sub>t + ½εt²</span>.</p>
<p>Polohový vektor: <span class="f">r⃗ = (R cos ωt; R sin ωt)</span>, trajektorie <span class="f">x² + y² = R²</span>.</p></div>

<div class="th"><h3>Dynamika</h3>
<p>Newtonovy zákony: setrvačnost; <span class="f">F⃗ = dp⃗/dt = ma⃗</span>; akce a reakce.</p>
<p class="f">třecí síla F<sub>t</sub> = f·N (na vodorovné podložce N = mg)</p>
<p>Vodorovné tažení se třením: <span class="f">a = (F − f mg)/m</span>. Síla z rychlosti: <span class="f">F = m·dv/dt</span>; zrychlení ze síly: <span class="f">a = F/m</span>.</p>
<p><b>Nakloněná rovina:</b> <span class="f">F<sub>p</sub> = mg sin α, N = mg cos α, F<sub>t</sub> = f mg cos α, a = g(sin α − f cos α)</span>; bez tření a = g sin α, délka roviny l = h/sin α, koncová rychlost v = √(2gh).</p>
<p><b>Setrvačné síly</b> zavádíme v neinerciálních soustavách: <span class="f">F⃗<sub>s</sub> = −ma⃗<sub>0</sub></span>, odstředivá <span class="f">mω²r</span>, Coriolisova <span class="f">−2mω⃗ × v⃗′</span>.</p></div>

<div class="th"><h3>Pád a vrhy (g = 9,81 m/s²)</h3>
<table class="t"><tr><th>pohyb</th><th>vztahy</th></tr>
<tr><td>volný pád</td><td class="f">v = gt, s = ½gt², doba pádu t = √(2h/g), v<sub>dopad</sub> = √(2gh)</td></tr>
<tr><td>vrh svislý vzhůru</td><td class="f">v = v<sub>0</sub> − gt, h = v<sub>0</sub>t − ½gt², H = v<sub>0</sub>²/(2g), v<sub>0</sub> = √(2gH)</td></tr>
<tr><td>vrh vodorovný</td><td class="f">x = v<sub>0</sub>t, y = h − ½gt², v = √(v<sub>0</sub>² + (gt)²), D = v<sub>0</sub>√(2h/g)</td></tr>
<tr><td>vrh šikmý</td><td class="f">x = v<sub>0</sub>t cos α, y = v<sub>0</sub>t sin α − ½gt², H = v<sub>0</sub>² sin²α/(2g), D = v<sub>0</sub>² sin 2α/g, T = 2v<sub>0</sub> sin α/g</td></tr></table>
<p>Energie v čase t: <span class="f">E<sub>k</sub> = ½mv², E<sub>p</sub> = mgh</span>; jejich součet je konstantní (zákon zachování mechanické energie) – dobrá kontrola výsledku.</p></div>

<div class="th"><h3>Práce, výkon, energie, hybnost</h3>
<table class="t"><tr><th>veličina</th><th>vztah</th><th>jednotka</th></tr>
<tr><td>práce</td><td class="f">W = ∫F⃗·dr⃗ = Fs cos α</td><td>J = N·m = kg·m²·s<sup>−2</sup></td></tr>
<tr><td>výkon</td><td class="f">P = dW/dt = F·v</td><td>W = J/s = kg·m²·s<sup>−3</sup></td></tr>
<tr><td>účinnost</td><td class="f">η = P/P<sub>0</sub></td><td>– (%)</td></tr>
<tr><td>kinetická energie</td><td class="f">E<sub>k</sub> = ½mv²</td><td>J</td></tr>
<tr><td>potenciální energie</td><td class="f">E<sub>p</sub> = mgh</td><td>J</td></tr>
<tr><td>hybnost</td><td class="f">p⃗ = mv⃗</td><td>kg·m·s<sup>−1</sup></td></tr>
<tr><td>impuls síly</td><td class="f">I⃗ = ∫F⃗ dt = FΔt = Δp⃗</td><td>N·s = kg·m·s<sup>−1</sup></td></tr></table>
<p><b>Zákon zachování hybnosti:</b> v izolované soustavě Σ p⃗ = konst. &nbsp; <b>1 kWh = 3,6·10<sup>6</sup> J</b>, 1 MWh = 3,6·10<sup>9</sup> J.</p></div>

<div class="th"><h3>Rotace tuhého tělesa</h3>
<p class="f">M⃗ = r⃗ × F⃗ = (r<sub>y</sub>F<sub>z</sub> − r<sub>z</sub>F<sub>y</sub>; r<sub>z</sub>F<sub>x</sub> − r<sub>x</sub>F<sub>z</sub>; r<sub>x</sub>F<sub>y</sub> − r<sub>y</sub>F<sub>x</sub>), &nbsp; M = Fd</p>
<p class="f">M = Jε, &nbsp; E<sub>k,rot</sub> = ½Jω², &nbsp; valení: E<sub>k</sub> = ½mv² + ½Jω² (v = ωR)</p>
<table class="t"><tr><th>těleso (osa těžištěm)</th><th>J</th></tr>
<tr><td>hmotný bod ve vzdálenosti r</td><td class="f">mr²</td></tr><tr><td>tenká obruč / dutý válec</td><td class="f">mR²</td></tr>
<tr><td>plný válec, disk (podélná osa)</td><td class="f">½mR²</td></tr><tr><td>plná koule</td><td class="f">⅖mR²</td></tr>
<tr><td>dutá koule (tenká slupka)</td><td class="f">⅔mR²</td></tr><tr><td>tenká tyč, osa kolmo středem</td><td class="f">1/12 ml²</td></tr><tr><td>tenká tyč, osa kolmo koncem</td><td class="f">⅓ml²</td></tr></table>
<p><b>Steinerova věta:</b> <span class="f">J = J<sub>T</sub> + md²</span> (d – vzdálenost rovnoběžné osy od těžiště).</p>
<div class="ex">Analogie posuvný ↔ rotační pohyb: s ↔ φ, v ↔ ω, a ↔ ε, m ↔ J, F ↔ M, p = mv ↔ L = Jω, ½mv² ↔ ½Jω².</div></div>`;

  figs([fig(plot({s:[S(X,0,ty==='exp'?2.2:5,300)],yl:'x [m]',xl:'t [s]',marks:[[t,X(t),'2 s']].concat(ob?[[ob,X(ob),'obrat']]:[]),w:340,h:190}),'x(t)')]))}}},

kolo:{n:'Kolo zpomaluje (ot/min) – ε, v, a_t, a_n',t:'kruh',pts:20,g(){const Rc=Ri(5,30)*10,n=Ri(2,12)*10,tz=Ri(2,8)*5,t=Ri(1,tz-1),R=Rc/100,w0=2*PI*n/60,e=-w0/tz,w=w0+e*t;
 return{html:`Kolo o poloměru ${Rc} cm se otáčí s frekvencí ${n} ot/min a začne zpomalovat, až se za ${tz} s zastaví. Určete úhlové zrychlení, obvodovou rychlost, tečné a normálové zrychlení v ${t} s pohybu.`,
 hint:'Záporné hodnoty (zpomalení) můžete zadat i jako velikost.',
 fields:[F('ε =',e,'rad/s²',{abs:1}),F('v =',w*R,'m/s'),F('a<sub>t</sub> =',e*R,'m/s²',{abs:1}),F('a<sub>n</sub> =',w*w*R,'m/s²')],
 sol:sol(P(fm(`ω<sub>0</sub> = 2πf = 2π·${n}/60 = ${N(w0)} rad/s`)),P(fm(`ε = (0 − ω<sub>0</sub>)/t<sub>z</sub> = −${N(w0)}/${tz} = ${N(e)} rad/s²`)),P(fm(`ω(${t}) = ω<sub>0</sub> + εt = ${N(w)} rad/s`)),
  P(fm(`v = ωR = ${N(w)}·${N(R)} = ${N(w*R)} m/s`)),P(fm(`a<sub>t</sub> = εR = ${N(e*R)} m/s², &nbsp; a<sub>n</sub> = ω²R = ${N(w*w*R)} m/s²`)),P(fm(`a = √(a<sub>t</sub>² + a<sub>n</sub>²) = ${N(Math.hypot(e*R,w*w*R))} m/s²`)))}}},

kruh_omega:{n:'ω(t) na kružnici – a_t, a_n, dráha a počet otáček',t:'kruh',pts:20,g(){const a=Ri(1,4),b=Ri(1,8),c=Ri(1,9),Rc=pick([50,80,100,100,120,150,200]),R=Rc/100,T=pick([5,8,10,10]);
 const w1=a+b+c,e1=3*a+b,ph=a/4*T**4+b/2*T*T+c*T;
 return{html:`Hmotný bod se pohybuje po kružnici o poloměru ${Rc} cm s úhlovou rychlostí ${fm(`ω = ${poly([[a,T3],[b,T1],[c,'']])}`)}. Určete tečné a normálové zrychlení. Určete dráhu uraženou hmotným bodem za ${T} sekund a počet otáček.`,
 hint:'Zrychlení jsou obecně funkce času – pro kontrolu dosaďte t = 1 s.',
 fields:[F('a<sub>t</sub>(1 s) =',e1*R,'m/s²'),F('a<sub>n</sub>(1 s) =',w1*w1*R,'m/s²'),F('s =',R*ph,'m'),F('N =',ph/(2*PI),'otáček')],
 sol:sol(P(fm(`ε = dω/dt = ${poly([[3*a,T2],[b,'']])}`)),P(fm(`a<sub>t</sub> = εR = ${N(R)}·(${poly([[3*a,T2],[b,'']])}) m/s², &nbsp; a<sub>n</sub> = ω²R = ${N(R)}·(${poly([[a,T3],[b,T1],[c,'']])})² m/s²`)),
  P(`Pro t = 1 s: ω = ${w1} rad/s, ε = ${e1} rad/s² ⇒ ${fm(`a<sub>t</sub> = ${N(e1*R)} m/s², a<sub>n</sub> = ${N(w1*w1*R)} m/s²`)}`),
  P(`Úhlová dráha = integrál ω (φ(0) = 0): ${fm(`φ(t) = ${poly([[a/4,T4],[b/2,T2],[c,T1]])}`)} ⇒ ${fm(`φ(${T}) = ${N(ph)} rad`)}`),
  P(fm(`s = Rφ = ${N(R)}·${N(ph)} = ${N(R*ph)} m, &nbsp; N = φ/(2π) = ${N(ph/(2*PI))} otáček`)))}}},

kruh_v:{n:'Rychlost v(t) na kružnici – a_t, a_n, a',t:'kruh',pts:20,g(){const R=Ri(2,8),a=Ri(1,3),b=Ri(2,9),c=Ri(1,5),t=pick([2,2,3]),v=a*t**3-b*t+c,at=3*a*t*t-b,an=v*v/R;
 return{html:`Hmotný bod se pohybuje po kružnici o poloměru ${R} m s rychlostí ${fm(`v = ${poly([[a,T3],[-b,T1],[c,'']])}`)}. Určete jeho rychlost a tečné, normálové a celkové zrychlení ve ${t} s.`,
 fields:[F('v =',v,'m/s'),F('a<sub>t</sub> =',at,'m/s²'),F('a<sub>n</sub> =',an,'m/s²'),F('a =',Math.hypot(at,an),'m/s²')],
 sol:sol(P(`${fm(`v(${t}) = ${N(v)} m/s`)}; &nbsp; ${fm(`a<sub>t</sub> = dv/dt = ${poly([[3*a,T2],[-b,'']])} = ${N(at)} m/s²`)}`),P(fm(`a<sub>n</sub> = v²/R = ${N(v)}²/${R} = ${N(an)} m/s²`)),P(fm(`a = √(a<sub>t</sub>² + a<sub>n</sub>²) = ${N(Math.hypot(at,an))} m/s²`)))}}},

kruh_phi:{n:'Úhlová dráha φ(t) – a_t, a_n, a',t:'kruh',pts:20,g(){const a=Ri(1,3),b=Ri(1,8),c=Ri(0,5),R=Ri(1,4),t=Ri(2,4),w=3*a*t*t-b,e=6*a*t,at=e*R,an=w*w*R;
 return{html:`Úhlová dráha hmotného bodu na kružnici o poloměru ${R} m je dána ${fm(`φ = ${poly([[a,T3],[-b,T1],[c,'']])}`)}. Určete tečné, normálové a celkové zrychlení ve ${t} s.`,
 fields:[F('a<sub>t</sub> =',at,'m/s²'),F('a<sub>n</sub> =',an,'m/s²'),F('a =',Math.hypot(at,an),'m/s²')],
 sol:sol(P(fm(`ω = dφ/dt = ${poly([[3*a,T2],[-b,'']])}, &nbsp; ε = dω/dt = ${6*a}t`)),P(`Ve ${t} s: ${fm(`ω = ${N(w)} rad/s, ε = ${N(e)} rad/s²`)}`),
  P(fm(`a<sub>t</sub> = εR = ${N(at)} m/s², &nbsp; a<sub>n</sub> = ω²R = ${N(an)} m/s², &nbsp; a = √(a<sub>t</sub>² + a<sub>n</sub>²) = ${N(Math.hypot(at,an))} m/s²`)))}}},

polkruh:{n:'Polohový vektor pohybu po kružnici (teorie)',t:'kruh',pts:20,g(){return{self:1,html:`Napište polohový vektor pohybu po kružnici, definujte jednotlivé použité koeficienty a určete rovnici trajektorie. Zakreslete polohový vektor do obrázku.`,
 model:`<p class="f">r⃗(t) = R cos(ωt + φ<sub>0</sub>) <b><i>i</i></b> + R sin(ωt + φ<sub>0</sub>) <b><i>j</i></b></p><p><b>R</b> – poloměr kružnice (|r⃗| = R), <b>ω</b> – úhlová rychlost [rad/s], ω = 2π/T = 2πf, <b>t</b> – čas, <b>φ<sub>0</sub></b> – počáteční fáze (úhel v t = 0), φ = ωt + φ<sub>0</sub> – úhlová dráha.</p>
 <p><b>Trajektorie:</b> x = R cos φ, y = R sin φ, cos²φ + sin²φ = 1 ⇒ <span class="f">x² + y² = R²</span> (kružnice se středem v počátku).</p><p>Navíc: v⃗ = ωR(−sin φ; cos φ), |v| = ωR (tečná); a⃗ = −ω²r⃗ (dostředivé).</p>${figs([fig(CIRC,'polohový vektor na kružnici')])}`}}},

/* ---------------- dynamika ---------------- */
bedna_fa:{n:'Bedna s třením – třecí síla a zrychlení',t:'dyn',pts:10,g(){const m=Ri(5,40),f=pick([0.1,0.12,0.15,0.2,0.25,0.3]),F0=Math.ceil(f*m*g)+Ri(5,80),Ft=f*m*g;
 return{html:`Bednu o m = ${m} kg taháme silou ${F0} N. Koeficient smykového tření je ${N(f)}. Určete třecí sílu a zrychlení výsledného pohybu.`,
 fields:[F('F<sub>t</sub> =',Ft,'N'),F('a =',(F0-Ft)/m,'m/s²')],
 sol:sol(P(fm(`F<sub>t</sub> = f·mg = ${N(f)}·${m}·9,81 = ${N(Ft)} N`)),P(`2. Newtonův zákon: ${fm(`ma = F − F<sub>t</sub> ⇒ a = (${F0} − ${N(Ft)})/${m} = ${N((F0-Ft)/m)} m/s²`)}`))}}},
bedna_av:{n:'Bedna s třením – zrychlení a rychlost za t',t:'dyn',pts:10,g(){const m=Ri(10,40),f=pick([0.1,0.12,0.15,0.2,0.25]),F0=Math.ceil(f*m*g)+Ri(10,120),t=Ri(2,10),Ft=f*m*g,a=(F0-Ft)/m;
 return{html:`Bednu o hmotnosti ${m} kg taháme silou ${F0} N. Koeficient smykového tření je ${N(f)}. Určete zrychlení bedny a rychlost za ${t} sekund.`,
 fields:[F('a =',a,'m/s²'),F('v =',a*t,'m/s')],
 sol:sol(P(fm(`F<sub>t</sub> = f·mg = ${N(f)}·${m}·9,81 = ${N(Ft)} N`)),P(fm(`a = (F − F<sub>t</sub>)/m = (${F0} − ${N(Ft)})/${m} = ${N(a)} m/s²`)),P(fm(`v = at = ${N(a)}·${t} = ${N(a*t)} m/s`)+' (z klidu)'))}}},
sila_v:{n:'Síla z rychlosti v(t)',t:'dyn',pts:10,g(){const m=Ri(2,20),a=Ri(1,6),b=Ri(1,9),c=Ri(0,9),t=Ri(1,5),ac=2*a*t+b;
 return{html:`Těleso o m = ${m} kg se pohybuje s rychlostí ${fm(`v = ${poly([[a,T2],[b,T1],[c,'']])}`)}. Určete sílu působící na těleso ve ${t} s.`,
 fields:[F('F =',m*ac,'N')],sol:sol(P(fm(`a = dv/dt = ${poly([[2*a,T1],[b,'']])} ⇒ a(${t}) = ${ac} m/s²`)),P(fm(`F = ma = ${m}·${ac} = ${m*ac} N`)))}}},
naklon:{n:'Nakloněná rovina se třením (teorie)',t:'dyn',pts:20,g(){return{self:1,html:`Uvažujte pohyb tělesa po nakloněné rovině se třením: načrtněte obrázek, vyznačte síly a uveďte jejich hodnoty pomocí úhlu sklonu nakloněné roviny, hmotnosti, tíhového zrychlení g a koeficientu smykového tření. Odvoďte výsledné zrychlení.`,
 model:`${figs([fig(INCL,'těleso klouže dolů po nakloněné rovině')])}<ul><li>tíhová síla G = mg, rozložená na</li><li>pohybovou složku G<sub>∥</sub> = mg sin α (podél roviny)</li><li>tlakovou složku G<sub>⊥</sub> = mg cos α (kolmo k rovině)</li><li>reakce podložky N = mg cos α</li><li>třecí síla F<sub>t</sub> = fN = f mg cos α (proti pohybu)</li></ul>
 <p>2. Newtonův zákon podél roviny: <span class="f">ma = mg sin α − f mg cos α ⇒ a = g(sin α − f cos α)</span>. Těleso se samo rozjede, jen když tg α &gt; f.</p>`}}},
newton1:{n:'1. Newtonův zákon (teorie)',t:'dyn',pts:5,g(){return{self:1,html:`Napište 1. Newtonův zákon.`,
 model:`<p><b>Zákon setrvačnosti:</b> Těleso setrvává v klidu nebo v rovnoměrném přímočarém pohybu, dokud není přinuceno vnějšími silami tento stav změnit (výslednice sil je nulová ⇒ v⃗ = konst.). Platí v inerciálních vztažných soustavách.</p>`}}},
zzh:{n:'Zákon zachování hybnosti (teorie)',t:'dyn',pts:5,g(){return{self:1,html:`Napište libovolnou formulaci zákona zachování hybnosti (slovně, rovnicí, na příkladu).`,
 model:`<p><b>Slovně:</b> V izolované soustavě (výslednice vnějších sil je nulová) je celková hybnost konstantní.</p><p><b>Rovnicí:</b> <span class="f">Σ p⃗<sub>i</sub> = m<sub>1</sub>v⃗<sub>1</sub> + m<sub>2</sub>v⃗<sub>2</sub> + … = konst.</span></p><p><b>Příklad:</b> srážka dvou koulí: m<sub>1</sub>v<sub>1</sub> + m<sub>2</sub>v<sub>2</sub> = m<sub>1</sub>v<sub>1</sub>′ + m<sub>2</sub>v<sub>2</sub>′; zpětný ráz pušky, raketový pohon.</p>`}}},

/* ---------------- vrhy ---------------- */
vodorovny:{n:'Vodorovný vrh (km/h) – délka letu, v, Ek, Ep',t:'vrh',pts:20,g(){const h=Ri(15,50)*20,vk=Ri(10,25)*10,v0=vk/3.6,tf=Math.sqrt(2*h/g),t=Ri(2,Math.min(5,Math.floor(tf)-1)),m=Ri(1,10),vy=g*t,y=h-g*t*t/2,v=Math.hypot(v0,vy);
 return{html:`Těleso o hmotnosti ${m} kg bylo vrženo vodorovně z výšky ${h} m rychlostí ${vk} km/h. Určete délku letu. Dále určete velikost rychlosti, kinetickou a potenciální energii ve ${t} s pohybu.`,
 hint:'V písemce hmotnost někdy chybí – pak energie napište obecně (např. jako E/m).',
 fields:[F('D =',v0*tf,'m'),F('|v| =',v,'m/s'),F('E<sub>k</sub> =',m*v*v/2,'J'),F('E<sub>p</sub> =',m*g*y,'J')],
 sol:sol(P(`${fm(`v<sub>0</sub> = ${vk}/3,6 = ${N(v0)} m/s`)}; &nbsp; ${fm('x = v<sub>0</sub>t, &nbsp; y = h − ½gt², &nbsp; v<sub>y</sub> = gt')}`),P(`Doba letu: ${fm(`t<sub>D</sub> = √(2h/g) = √(2·${h}/9,81) = ${N(tf)} s`)}, délka letu ${fm(`D = v<sub>0</sub>t<sub>D</sub> = ${N(v0*tf)} m`)}`),
  P(`Ve ${t} s: ${fm(`v<sub>y</sub> = ${N(vy)} m/s, &nbsp; |v| = √(v<sub>0</sub>² + v<sub>y</sub>²) = ${N(v)} m/s, &nbsp; y = ${h} − ½·9,81·${t}² = ${N(y)} m`)}`),
  P(fm(`E<sub>k</sub> = ½mv² = ½·${m}·${N(v)}² = ${N(m*v*v/2)} J, &nbsp; E<sub>p</sub> = mgy = ${m}·9,81·${N(y)} = ${N(m*g*y)} J`)),P(`Kontrola: E<sub>k</sub> + E<sub>p</sub> = ${N(m*v*v/2+m*g*y)} J = ½mv<sub>0</sub>² + mgh = ${N(m*v0*v0/2+m*g*h)} J ✓`))}}},
vodorovny_e:{n:'Vodorovný vrh (m/s) – Ek a Ep ve 4 s',t:'vrh',pts:20,g(){const m=Ri(2,10),h=Ri(15,45)*20+pick([0,0,20]),v0=Ri(20,90),t=4,vy=g*t,y=h-g*t*t/2,v=Math.hypot(v0,vy);
 return{html:`Těleso o hmotnosti ${m} kg bylo vrženo vodorovně z výšky ${h} metrů rychlostí ${v0} m/s. Určete kinetickou a potenciální energii ve ${t}. sekundě pohybu.`,
 fields:[F('E<sub>k</sub> =',m*v*v/2,'J'),F('E<sub>p</sub> =',m*g*y,'J')],
 sol:sol(P(fm(`v<sub>y</sub> = gt = 9,81·${t} = ${N(vy)} m/s, &nbsp; v² = v<sub>0</sub>² + v<sub>y</sub>² = ${N(v*v)} m²/s²`)),P(fm(`y = h − ½gt² = ${h} − ${N(g*t*t/2)} = ${N(y)} m`)),
  P(fm(`E<sub>k</sub> = ½mv² = ${N(m*v*v/2)} J, &nbsp; E<sub>p</sub> = mgy = ${N(m*g*y)} J`)),P(`Kontrola ZZE: ${N(m*v*v/2+m*g*y)} J = ½mv<sub>0</sub>² + mgh ✓`))}}},
svisly:{n:'Svislý vrh – výška ↔ počáteční rychlost',t:'vrh',pts:10,g(){if(Ri(0,1)){const H=Ri(2,30)*10;return{html:`Těleso bylo vrženo svisle vzhůru počáteční rychlostí v<sub>0</sub> a vystoupalo do výšky ${H} m, jaká byla počáteční rychlost?`,
  fields:[F('v<sub>0</sub> =',Math.sqrt(2*g*H),'m/s')],sol:P(`ZZE (nahoře v = 0): ${fm(`½mv<sub>0</sub>² = mgH ⇒ v<sub>0</sub> = √(2gH) = √(2·9,81·${H}) = ${N(Math.sqrt(2*g*H))} m/s`)}`)}}
 const v0=Ri(5,40);return{html:`Těleso bylo vrženo svisle vzhůru počáteční rychlostí ${v0} m/s, do jaké výšky vystoupá?`,fields:[F('H =',v0*v0/(2*g),'m')],
  sol:P(`${fm(`H = v<sub>0</sub>²/(2g) = ${v0}²/(2·9,81) = ${N(v0*v0/(2*g))} m`)} (v nejvyšším bodě v = 0, čas výstupu t = v<sub>0</sub>/g = ${N(v0/g)} s)`)}}},
svisly_e:{n:'Svislý vrh – v0, Ek a Ep v čase t',t:'vrh',pts:20,g(){const m=Ri(2,20),H=Ri(10,40)*10-pick([0,5,8]),v0=Math.sqrt(2*g*H),t=pick([2,2,4].filter(s=>s<v0/g)),v=v0-g*t,h=v0*t-g*t*t/2;
 return{html:`Jakou rychlostí bylo těleso o hmotnosti ${m} kg vystřeleno svisle vzhůru, jestliže dosáhlo výšky ${H} metrů? Jaká byla jeho kinetická a potenciální energie ve ${t}. sekundě?`,
 fields:[F('v<sub>0</sub> =',v0,'m/s'),F('E<sub>k</sub> =',m*v*v/2,'J'),F('E<sub>p</sub> =',m*g*h,'J')],
 sol:sol(P(fm(`v<sub>0</sub> = √(2gH) = √(2·9,81·${H}) = ${N(v0)} m/s`)),P(`Ve ${t} s: ${fm(`v = v<sub>0</sub> − gt = ${N(v)} m/s, &nbsp; h = v<sub>0</sub>t − ½gt² = ${N(h)} m`)}`),
  P(fm(`E<sub>k</sub> = ½mv² = ${N(m*v*v/2)} J, &nbsp; E<sub>p</sub> = mgh = ${N(m*g*h)} J`)),P(`Kontrola: E<sub>k</sub> + E<sub>p</sub> = ${N(m*v*v/2+m*g*h)} J = mgH = ${N(m*g*H)} J ✓`))}}},

/* ---------------- práce, energie, hybnost ---------------- */
prace_zved:{n:'Práce při zvednutí + jiný vztah pro práci',t:'en',pts:10,g(){const m=Ri(2,50),h=Ri(2,50);
 return{html:`Jaká práce byla vykonána při zvednutí tělesa o hmotnosti ${m} kg do výšky ${h} m? Uveďte libovolný jiný než použitý vztah pro výpočet práce a její jednotku.`,
 fields:[F('W =',m*g*h,'J')],sol:sol(P(fm(`W = Fs = mgh = ${m}·9,81·${h} = ${N(m*g*h)} J`)),P(`Jiné vztahy: ${fm('W = Fs cos α')}, ${fm('W = ∫F⃗·dr⃗')}, ${fm('W = ΔE<sub>k</sub>')}, ${fm('W = Pt')}. Jednotka joule: 1 J = 1 N·m = 1 kg·m²·s<sup>−2</sup>.`))}}},
prace_posun:{n:'Práce při posunutí tělesa (m, s)',t:'en',pts:5,g(){const m=Ri(5,30),s=Ri(2,20);
 return{html:`Jaká práce byla vykonána při posunutí tělesa o hmotnosti ${m} kg na dráze ${s} m?`,
 fields:[F('W =',m*g*s,'J')],sol:sol(P(fm(`W = F·s = mg·s = ${m}·9,81·${s} = ${N(m*g*s)} J`)),P('<span class="hint">Zadání je neúplné – počítá se se silou rovnou tíze tělesa (F = mg, např. posun svisle vzhůru). Při vodorovném posunu bez tření konstantní rychlostí by práce byla nulová; v písemce je dobré předpoklad napsat.</span>'))}}},
prace_uhel:{n:'Práce, síla svírá s dráhou úhel',t:'en',pts:10,g(){const Fo=Ri(2,20)*5,s=Ri(1,20)*10,k=pick([[6,'π/6',30],[4,'π/4',45],[3,'π/3',60]]),W=Fo*s*Math.cos(PI/k[0]);
 return{html:`Jakou práci vykonáte tlačením vozíku silou ${Fo} N na vodorovné dráze délky ${s} m. Směr síly svírá s dráhou úhel ${k[1]}.`,
 fields:[F('W =',W,'J')],sol:P(`Práci koná jen složka síly ve směru posunutí: ${fm(`W = Fs cos α = ${Fo}·${s}·cos ${k[1]} = ${Fo*s}·${N(Math.cos(PI/k[0]),4)} = ${N(W)} J`)}`)}}},
sila_prace:{n:'Síla z vykonané práce',t:'en',pts:5,g(){const s=Ri(2,20)*5,Fo=Ri(2,40)*5;
 return{html:`Jakou (vodorovnou) silou bylo taženo těleso, pokud byla na dráze ${s} m vykonána práce ${Fo*s} J?`,fields:[F('F =',Fo,'N')],sol:P(fm(`W = Fs ⇒ F = W/s = ${Fo*s}/${s} = ${Fo} N`))}}},
prikon:{n:'Příkon, výkon, účinnost',t:'en',pts:10,g(){const P0=Ri(2,40)*100,eta=Ri(10,19)*5;
 return{html:`Stroj má příkon ${P0} W. Jaký je výkon při účinnosti ${eta} %? Definujte výkon, účinnost a jejich jednotky.`,fields:[F('P =',P0*eta/100,'W')],

/* =================== skladby písemek =================== */
const POOL_ZF={20:['auto','vodorovny','kruh_omega','kolo','polkruh','naklon'],
 10:['vec3','xquad','rvec','prace_zved','prace_uhel','tyc','prikon','mic','bedna_fa','bedna_av','sila_v','kutali_obec','kutaleni','svisly','hybnost','koule_okraj','steiner','jednotky'],
 5:['vlin','prace_posun','sila_prace','kwh','newton1','zzh','moment']};
const SLOTS_FEI=[['traj2d','xfun','vpoly'],['traj2d','xfun','kruh_v','vpoly'],['bedna_av','brzdeni','kruh_phi','traj2d'],['svisly_e','vodorovny_e','bedna_av'],['kutaleni','rot_okraj']];
function makeQ(k,pts){const G=GEN[k],q=G.g();q.key=k;q.pts=pts??G.pts;return q}
function buildZF(){const a=shuf(POOL_ZF[20]).slice(0,2),b=shuf(POOL_ZF[10]).slice(0,5),c=shuf(POOL_ZF[5]).slice(0,2);
 const ks=shuf([...a.map(k=>[k,20]),...b.map(k=>[k,10]),...c.map(k=>[k,5])]);return ks.map(([k,p])=>makeQ(k,p))}
function buildFEI(){const used=new Set();return SLOTS_FEI.map(s=>{const k=pick(s.filter(x=>!used.has(x)));used.add(k);return makeQ(k,20)})}


/* =================== vyhodnocení =================== */
function parse(s){s=String(s??'').trim().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/[·×*]10\^?\(?(-?\d+)\)?$/,'e$1').replace(/^10\^/,'1e').replace(/°$/,'');
 let m=/^([-+]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/.exec(s);if(m)return Number(m[1])/Number(m[2]);
 if(!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s))return NaN;return Number(s)}
function fOK(f,val){if(f.sel)return val!==''&&val!=null&&Number(val)===f.v;const x=parse(val);if(isNaN(x))return false;
 if(f.ang){let d=Math.abs(x-f.v)%360;d=Math.min(d,360-d);return d<=1.5}
 const ok=y=>Math.abs(y-f.v)<=Math.max(Math.abs(f.v)*0.015,0.006);return ok(x)||(f.abs&&ok(-x))}

const ST={qs:[],ans:[],checked:[],cur:0,done:false,left:0,t:null,start:null,end:null,view:'home',mode:null};
const app=document.getElementById('app');
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fmtD=d=>d.toLocaleString('cs',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const pts=p=>(Math.round(p*100)/100).toFixed(2).replace('.',',');
const MODES={zf:{n:'Zápočtová písemka ZF',min:60},fei:{n:'Písemka FEI 2025',min:60}};

function start(mode){
 ST.mode=mode;
 if(mode==='zf')ST.qs=buildZF();else if(mode==='fei')ST.qs=buildFEI();else ST.qs=Array.from({length:4},()=>makeQ(mode));
 ST.ans=ST.qs.map(q=>q.self?{txt:'',ok:null}:q.fields.map(()=>''));
 ST.checked=ST.qs.map(()=>false);ST.cur=0;ST.done=false;ST.start=new Date();clearInterval(ST.t);
 if(MODES[mode]){ST.left=MODES[mode].min*60;ST.t=setInterval(()=>{ST.left--;if(ST.left<=0)finish();else{const e=document.getElementById('tm');if(e)e.textContent=fmt(ST.left)}},1000)}
 ST.view='test';render();window.scrollTo(0,0);
}
function finish(){clearInterval(ST.t);ST.done=true;ST.end=new Date();ST.view='review';render();window.scrollTo(0,0)}
function frac(i){const q=ST.qs[i],a=ST.ans[i];if(q.self)return a.ok?1:0;const r=q.fields.map((f,k)=>fOK(f,a[k]));return r.filter(Boolean).length/r.length}
const score=()=>ST.qs.reduce((s,q,i)=>s+q.pts*frac(i),0);
const total=()=>ST.qs.reduce((s,q)=>s+q.pts,0);

/* =================== vykreslení úlohy =================== */
function qBody(i,show){
 const q=ST.qs[i],a=ST.ans[i];let h=`<div class="qt">${q.html}</div>`;
 if(q.self){
  h+=`<textarea placeholder="Sem si můžete napsat svou odpověď (nehodnotí se automaticky)…" ${show?'disabled':''} oninput="ST.ans[${i}].txt=this.value">${a.txt.replace(/</g,'&lt;')}</textarea>`;
  if(show){h+=`<div class="model"><b>Vzorová odpověď</b>${q.model}</div>
   <div class="selfq">Odpovídá vaše odpověď vzorové? <button class="btn o ${a.ok===true?'on':''}" onclick="ST.ans[${i}].ok=true;render()">✓ Ano – uznat body</button><button class="btn o ${a.ok===false?'on':''}" onclick="ST.ans[${i}].ok=false;render()">✗ Ne</button></div>`}
  return h;
 }
 if(q.hint)h+=`<div class="hint">${q.hint}</div>`;
 h+=`<div class="flds">`+q.fields.map((f,k)=>{const r=show&&fOK(f,a[k]);
  const ctl=f.sel?`<select class="${show?(r?'right':'wrong'):''}" ${show?'disabled':''} onchange="ST.ans[${i}][${k}]=this.value;mark(${i})"><option value="">— vyberte —</option>${f.sel.map((o,j)=>`<option value="${j}" ${String(a[k])===String(j)?'selected':''}>${o}</option>`).join('')}</select>`
   :`<input type="text" inputmode="decimal" autocomplete="off" class="${show?(r?'right':'wrong'):''}" value="${String(a[k]).replace(/"/g,'&quot;')}" ${show?'disabled':''} oninput="ST.ans[${i}][${k}]=this.value;mark(${i})">`;
  return `<div class="row"><span class="lbl">${f.l}</span>${ctl}<span>${f.u}</span>${show?`<span class="${r?'ok':'bad'} mark">${r?'✓':'✗ '+(f.sel?f.sel[f.v]:N(f.v)+' '+f.u)}</span>`:''}</div>`}).join('')+`</div>`;
 if(show)h+=`<details class="sol" ${frac(i)===1?'':'open'}><summary>Postup řešení</summary>${q.sol}${res(q.fields)}</details>`;
 return h;
}
function stat(i,show){const q=ST.qs[i];if(!show)return['Nedokončeno','',`Počet bodů z ${pts(q.pts)}`];
 if(q.self&&ST.ans[i].ok===null)return['Ohodnoťte se podle vzorové odpovědi','warn',`Bodů ? / ${pts(q.pts)}`];
 const f=frac(i);return[f===1?'Správně':f>0?'Částečně správně':'Nesprávně',f===1?'ok':f>0?'warn':'bad',`Bodů ${pts(q.pts*f)} / ${pts(q.pts)}`]}
function qBlock(i,review){const q=ST.qs[i],show=review||ST.checked[i],[st,cls,bod]=stat(i,show);
 return `<section class="q" id="q${i}"><div class="qh"><h2>Úloha <b>${i+1}</b></h2><span class="${cls}">${st}</span><span>${bod}</span><span class="tag">${GEN[q.key].n}</span></div>${qBody(i,show)}</section>`}
function mark(i){const b=document.querySelectorAll('.grid button')[i];if(b)b.classList.add('done')}
function navPanel(){return `<aside class="nav"><h3>Navigace testu</h3><div class="grid">${ST.qs.map((q,i)=>{
  const a=ST.ans[i],filled=q.self?!!a.txt:a.some(x=>x!=='');let cls;
  if(ST.done){if(q.self&&a.ok===null)cls='h';else{const f=frac(i);cls=f===1?'r':f>0?'h':'w'}}else cls=(i===ST.cur?'cur ':'')+(filled?'done':'');
  return `<button class="${cls}" onclick="go(${i})">${i+1}</button>`}).join('')}</div><p style="margin-top:16px">${ST.done?`<a onclick="ST.view='home';render()">Zpět na úvod</a>`:`<a onclick="if(confirm('Opravdu dokončit test?'))finish()">Konec testu…</a>`}</p></aside>`}
function go(i){ST.cur=i;if(ST.done)document.getElementById('q'+i).scrollIntoView({behavior:'smooth'});else render()}
function check(i){ST.checked[i]=true;render()}

/* =================== přehled zadání =================== */

/* =================== render =================== */
const GROUPS=[['kin','Kinematika'],['kruh','Pohyb po kružnici'],['dyn','Dynamika'],['vrh','Vrhy'],['en','Práce, energie, hybnost'],['rot','Rotace tuhého tělesa']];
const tabs=on=>`<div class="tabs">${[['home','Test'],['theory','Přehled teorie'],['over','Jak vypadají zadání']].map(([k,t])=>`<a class="${on===k?'on':''}" onclick="ST.view='${k}';render()">${t}</a>`).join('')}</div>`;
function render(){
 if(ST.view==='home'){
  app.innerHTML=tabs('home')+`<div class="info"><b>Simulace zápočtové písemky z fyziky</b> podle skutečných zadání (ZF var. A–F a FEI 2025 var. A–H). Každý pokus sestaví novou písemku z typů příkladů, které se v zadáních objevily, s novými čísly.</div>
  <button class="btn" onclick="start('zf')">Písemka ZF (9 příkladů, 100 b)</button> &nbsp; <button class="btn" onclick="start('fei')">Písemka FEI 2025 (5 příkladů, 100 b)</button>
  <p style="margin-top:30px">Časový limit: 60 min. Výpočty se kontrolují automaticky (g = 9,81 m/s², tolerance 1,5 %, desetinná čárka i tečka, zlomky typu 43/192). U příkladů s více výsledky se body dělí podle počtu správných polí.
  Teoretické otázky si po kontrole porovnáte se <b>vzorovou odpovědí</b> a body si uznáte sami. U každé úlohy je <b>postup řešení</b> včetně grafů.</p>
  <h3 style="margin-top:34px">Procvičování jednoho typu</h3><p style="color:#6a737b;margin-top:0">4 příklady stejného typu s různými čísly, bez časového limitu.</p>
  ${GROUPS.map(([g_,t])=>`<h4 class="grp">${t}</h4>`+Object.entries(GEN).filter(([k,v])=>v.t===g_).map(([k,v])=>`<button class="btn o" onclick="start('${k}')">${v.n}</button>`).join('')).join('')}`;
 }else if(ST.view==='theory'){app.innerHTML=tabs('theory')+THEORY}
 else if(ST.view==='over'){app.innerHTML=tabs('over')+OVERVIEW}
 else if(ST.view==='test'){
  const i=ST.cur,tm=MODES[ST.mode];
  app.innerHTML=`<div class="layout"><div>${tm?`<div style="text-align:right"><span class="timer">Zbývající čas <span id="tm">${fmt(ST.left)}</span></span></div>`:`<p style="color:#6a737b">Procvičování: <b>${GEN[ST.mode].n}</b></p>`}${qBlock(i,false)}
  <button class="btn g" onclick="check(${i})">Zkontrolovat</button>
  <div class="foot"><span>${i>0?`<button class="btn g" onclick="go(${i-1})">Předchozí stránka</button>`:''}</span><span>${i<ST.qs.length-1?`<button class="btn" onclick="go(${i+1})">Další stránka</button>`:`<button class="btn" onclick="if(confirm('Opravdu dokončit test?'))finish()">Dokončit pokus</button>`}</span></div></div>${navPanel()}</div>`;
 }else{
  const sc=score(),t=total(),dur=Math.round((ST.end-ST.start)/1000),pend=ST.qs.filter((q,i)=>q.self&&ST.ans[i].ok===null).length;
  app.innerHTML=`<div class="layout"><div><table class="sum">
  <tr><th>Stav</th><td>Dokončeno${MODES[ST.mode]?' – '+MODES[ST.mode].n:''}</td></tr><tr><th>Zahájení</th><td>${fmtD(ST.start)}</td></tr><tr><th>Dokončeno</th><td>${fmtD(ST.end)}</td></tr>
  <tr><th>Trvání</th><td>${dur>=60?Math.floor(dur/60)+' min. '+dur%60+' sekund':dur+' sekund'}</td></tr>
  <tr><th>Body</th><td><b>${pts(sc)}</b> z možných ${pts(t)} (<b>${Math.round(sc/t*100)}</b> %)${pend?` <span class="warn">– ještě ohodnoťte ${pend} teoretick${pend===1?'ou otázku':'é otázky'}</span>`:''}</td></tr></table>
  ${ST.qs.map((_,i)=>qBlock(i,true)).join('')}<div class="foot"><button class="btn" onclick="start(ST.mode)">Nový pokus</button></div></div>${navPanel()}</div>`;
 }
}
render();

</script>
</body>
